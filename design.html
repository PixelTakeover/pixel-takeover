<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Pixel Takeover - Design Your Pixels</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  font-family: Arial, sans-serif;
  background: #111;
  color: white;
}

.container {
  max-width: 700px;
  margin: auto;
}

h1 {
  text-align: center;
  margin-bottom: 10px;
}

.subtitle {
  text-align: center;
  color: #bbb;
  margin-bottom: 25px;
}

.card {
  background: #1c1c1c;
  padding: 20px;
  border-radius: 15px;
  margin-bottom: 20px;
}

label {
  display: block;
  margin-top: 15px;
  margin-bottom: 7px;
  font-weight: bold;
}

input,
textarea,
select {
  width: 100%;
  padding: 12px;
  border-radius: 8px;
  border: 1px solid #555;
  background: #2a2a2a;
  color: white;
  font-size: 16px;
}

textarea {
  min-height: 100px;
  resize: vertical;
}

input[type="color"] {
  height: 50px;
  padding: 4px;
  cursor: pointer;
}

input[type="range"] {
  padding: 0;
}

input[type="file"] {
  background: #2a2a2a;
}

#pixelCount {
  color: #00ff99;
  font-weight: bold;
}

#preview {
  position: relative;
  width: 100%;
  min-height: 280px;
  margin: 25px auto;
  padding: 15px;
  border: 2px dashed #666;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  background: #080808;
}

#pixelPreview {
  display: grid;
  gap: 1px;
  width: min(90vw, 500px);
  max-width: 100%;
  margin: auto;
  background: #333;
  padding: 2px;
  overflow: hidden;

  --pixel-bg: #ffffff;
}

.previewPixel {
  aspect-ratio: 1 / 1;
  min-width: 8px;
  min-height: 8px;
}

.previewPixel.selected {
  background: var(--pixel-bg, #ffffff);
}

.previewPixel.empty {
  background: #111111;
  opacity: 0.25;
}

#previewImage {
  position: absolute;
  max-width: 70%;
  max-height: 70%;
  object-fit: contain;
  display: none;
  pointer-events: none;
  z-index: 5;
}

#previewMessage {
  position: absolute;
  max-width: 80%;
  word-wrap: break-word;
  text-align: center;
  font-weight: bold;
  pointer-events: none;
  z-index: 6;
}

.buttonRow {
  display: flex;
  gap: 10px;
  margin-top: 20px;
}

button {
  flex: 1;
  padding: 15px;
  border: none;
  border-radius: 10px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

#saveButton {
  background: #00ff99;
  color: #111;
}

#backButton {
  background: #444;
  color: white;
}

button:hover {
  opacity: 0.85;
}

.smallText {
  color: #aaa;
  font-size: 13px;
  margin-top: 6px;
}

</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
</head>

<body>

<div class="container">

  <h1>Design Your Pixels</h1>

  <div class="subtitle">
    Make your space yours.
  </div>


  <div class="card">

    <h2>
      Your Selection:
      <span id="pixelCount">0</span> Pixels
    </h2>

    <p>
      Your selected pixels will appear in the preview below.
    </p>


    <label for="designTitle">
      Design Title
    </label>

    <input
      type="text"
      id="designTitle"
      placeholder="Give your design a name"
    >


    <label for="message">
      Your Message
    </label>

    <textarea
      id="message"
      placeholder="Type something..."
    ></textarea>


    <label for="backgroundColor">
      Pixel Background Color
    </label>

    <input
      type="color"
      id="backgroundColor"
      value="#ffffff"
    >


    <label for="messageColor">
      Text Color
    </label>

    <input
      type="color"
      id="messageColor"
      value="#000000"
    >


    <label for="fontFamily">
      Font
    </label>

    <select id="fontFamily">

      <option value="Arial">
        Arial
      </option>

      <option value="Verdana">
        Verdana
      </option>

      <option value="Georgia">
        Georgia
      </option>

      <option value="Times New Roman">
        Times New Roman
      </option>

      <option value="Courier New">
        Courier New
      </option>

      <option value="Impact">
        Impact
      </option>

      <option value="Trebuchet MS">
        Trebuchet MS
      </option>

    </select>


    <label for="messageSize">
      Text Size:
      <span id="sizeValue">28</span>px
    </label>

    <input
      type="range"
      id="messageSize"
      min="10"
      max="100"
      value="28"
    >


    <label for="designImage">
      Upload Your Design
    </label>

    <input
      type="file"
      id="designImage"
      accept="image/*"
    >

    <div class="smallText">
      You can upload a logo, artwork, photo, or other image.
    </div>

  </div>


  <div class="card">

    <h2>Live Preview</h2>

    <p>
      This shows the actual area you selected.
    </p>

    <div id="preview">

      <div id="pixelPreview"></div>

      <img
        id="previewImage"
        alt="Your uploaded design"
      >

      <div id="previewMessage"></div>

    </div>

  </div>


  <div class="buttonRow">

    <button
      id="backButton"
      type="button"
    >
      Go Back
    </button>

    <button
      id="saveButton"
      type="button"
    >
      Save My Design
    </button>

  </div>

</div>


<script>

/* ---------------------------------
   READ SELECTED PIXELS
---------------------------------- */

const params =
  new URLSearchParams(window.location.search);

const pixelData =
  params.get("pixels");

let selectedPixels = [];

if (pixelData) {

  try {

    selectedPixels =
      JSON.parse(
        decodeURIComponent(pixelData)
      );

  } catch (error) {

    console.error(
      "Could not read selected pixels:",
      error
    );

  }

}


/* ---------------------------------
   PAGE ELEMENTS
---------------------------------- */

const pixelCount =
  document.getElementById("pixelCount");

const pixelPreview =
  document.getElementById("pixelPreview");

const designTitle =
  document.getElementById("designTitle");

const message =
  document.getElementById("message");

const backgroundColor =
  document.getElementById("backgroundColor");

const messageColor =
  document.getElementById("messageColor");

const fontFamily =
  document.getElementById("fontFamily");

const messageSize =
  document.getElementById("messageSize");

const sizeValue =
  document.getElementById("sizeValue");

const designImage =
  document.getElementById("designImage");

const previewImage =
  document.getElementById("previewImage");

const previewMessage =
  document.getElementById("previewMessage");

const saveButton =
  document.getElementById("saveButton");

const backButton =
  document.getElementById("backButton");


/* ---------------------------------
   PIXEL COUNT
---------------------------------- */

pixelCount.textContent =
  selectedPixels.length;


/* ---------------------------------
   DRAW EXACT PIXEL SELECTION
---------------------------------- */

function renderPixelPreview() {

  pixelPreview.innerHTML = "";

  if (selectedPixels.length === 0) {

    pixelPreview.style.gridTemplateColumns =
      "repeat(1, 1fr)";

    return;

  }


  const coords =
    selectedPixels.map(value => {

      const parts =
        value.split(",").map(Number);

      return {
        x: parts[0],
        y: parts[1]
      };

    });


  const minX =
    Math.min(...coords.map(p => p.x));

  const maxX =
    Math.max(...coords.map(p => p.x));

  const minY =
    Math.min(...coords.map(p => p.y));

  const maxY =
    Math.max(...coords.map(p => p.y));


  const width =
    maxX - minX + 1;


  const selectedSet =
    new Set(selectedPixels);


  pixelPreview.style.gridTemplateColumns =
    `repeat(${width}, 1fr)`;


  for (
    let y = minY;
    y <= maxY;
    y++
  ) {

    for (
      let x = minX;
      x <= maxX;
      x++
    ) {

      const cell =
        document.createElement("div");

      cell.className =
        "previewPixel";


      const key =
        `${x},${y}`;


      if (
        selectedSet.has(key)
      ) {

        cell.classList.add(
          "selected"
        );

      } else {

        cell.classList.add(
          "empty"
        );

      }


      pixelPreview.appendChild(
        cell
      );

    }

  }

}


/* ---------------------------------
   UPDATE LIVE PREVIEW
---------------------------------- */

function updatePreview() {

  /* Pixel background */

  pixelPreview.style.setProperty(
    "--pixel-bg",
    backgroundColor.value
  );


  /* Message */

  previewMessage.textContent =
    message.value;


  previewMessage.style.color =
    messageColor.value;


  previewMessage.style.fontFamily =
    fontFamily.value;


  previewMessage.style.fontSize =
    messageSize.value + "px";


  sizeValue.textContent =
    messageSize.value;

}


/* ---------------------------------
   MESSAGE CHANGES
---------------------------------- */

message.addEventListener(
  "input",
  updatePreview
);


/* ---------------------------------
   BACKGROUND COLOR
---------------------------------- */

backgroundColor.addEventListener(
  "input",
  updatePreview
);


/* ---------------------------------
   TEXT COLOR
---------------------------------- */

messageColor.addEventListener(
  "input",
  updatePreview
);


/* ---------------------------------
   FONT
---------------------------------- */

fontFamily.addEventListener(
  "change",
  updatePreview
);


/* ---------------------------------
   FONT SIZE
---------------------------------- */

messageSize.addEventListener(
  "input",
  updatePreview
);


/* ---------------------------------
   IMAGE UPLOAD
---------------------------------- */

designImage.addEventListener(
  "change",
  function() {

    const file =
      designImage.files[0];

    if (!file) {

      previewImage.style.display =
        "none";

      return;

    }


    const reader =
      new FileReader();


    reader.onload =
      function(event) {

        previewImage.src =
          event.target.result;

        previewImage.style.display =
          "block";

      };


    reader.readAsDataURL(file);

  }
);


/* ---------------------------------
   SAVE DESIGN
---------------------------------- */

saveButton.addEventListener(
  "click",
  async function() {

    if (selectedPixels.length === 0) {

      alert(
        "Please go back and select your pixels first."
      );

      return;

    }

    if (!designTitle.value.trim()) {

      alert(
        "Please give your design a title."
      );

      designTitle.focus();

      return;

    }

    saveButton.disabled = true;
    saveButton.textContent = "Saving...";

    try {

      const designData = {

        title: designTitle.value.trim(),

        message: message.value,

        backgroundColor: backgroundColor.value,

        messageColor: messageColor.value,

        fontFamily: fontFamily.value,

        messageSize: Number(messageSize.value),

        selectedPixels: selectedPixels

      };


      const { data, error } =
        await supabase
          .from("Pixel_claims")
          .insert([
            {
              campaign_id: c40f5b21-b3a5-45ed-8643-a0b590e0,
              owner_email: "",
              design_data: designData
            }
          ])
          .select();


      if (error) {

        console.error(
          "Supabase save error:",
          error
        );

        alert(
          "There was a problem saving your design: " +
          error.message
        );

        return;

      }


      console.log(
        "Design saved:",
        data
      );


      alert(
        "Your design has been saved!"
      );


    } catch (error) {

      console.error(
        "Unexpected error:",
        error
      );

      alert(
        "Something went wrong while saving your design."
      );

    } finally {

      saveButton.disabled = false;
      saveButton.textContent =
        "Save My Design";

    }

  }
);


/* ---------------------------------
   GO BACK
---------------------------------- */

backButton.addEventListener(
  "click",
  function() {

    window.history.back();

  }
);


/* ---------------------------------
   START
---------------------------------- */

renderPixelPreview();

updatePreview();

</script>

</body>
</html>
