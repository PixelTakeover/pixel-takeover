<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pixel Takeover</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #111;
  color: white;
}

header {
  text-align: center;
  padding: 25px 15px 15px;
}

h1 {
  margin: 0;
  font-size: 32px;
  letter-spacing: 3px;
}

.subtitle {
  margin-top: 8px;
  font-size: 15px;
  opacity: .8;
}

.info {
  display: flex;
  justify-content: center;
  gap: 25px;
  flex-wrap: wrap;
  padding: 15px;
  font-size: 16px;
}

#canvasWrapper {
  width: 100%;
  overflow: auto;
  padding: 15px;
  touch-action: none;
}

#pixelCanvas {
  display: grid;

  grid-template-columns: repeat(100, 7px);
  grid-template-rows: repeat(100, 7px);

  gap: 1px;

  width: max-content;
  margin: auto;

  background: #333;
  padding: 2px;

  user-select: none;
  touch-action: none;
}

.pixel {
  width: 7px;
  height: 7px;

  background: #222;

  border: 1px solid #333;

  cursor: pointer;
}

.pixel:hover {
  background: #555;
}

.pixel.selected {
  background: #fff;
}

.pixel.claimed {
  background: #777;
  cursor: not-allowed;
}

.controls {
  text-align: center;
  padding: 20px;
}

button {
  border: none;
  border-radius: 8px;

  padding: 14px 24px;

  font-size: 16px;
  font-weight: bold;

  cursor: pointer;
}

#claimButton {
  background: white;
  color: #111;
}

#claimButton:disabled {
  opacity: .4;
  cursor: not-allowed;
}

#clearButton {
  background: #444;
  color: white;
  margin-left: 8px;
}

.note {
  text-align: center;
  padding: 0 20px 30px;

  font-size: 13px;

  opacity: .65;
}

.selectionHint {
  text-align: center;
  margin: 0 20px 10px;
  color: #aaa;
  font-size: 14px;
}

</style>

</head>

<body>

<header>

<h1>PIXEL TAKEOVER</h1>

<div class="subtitle">
45 DAYS. ONE GIANT CANVAS.
</div>

</header>


<div class="info">

<div>
💲 $1 = 1 PIXEL
</div>

<div>
Selected:
<strong id="selectedCount">0</strong>
</div>

<div>
Total: $
<strong id="totalPrice">0</strong>
</div>

</div>


<div class="selectionHint">

Tap individual pixels, or drag across an area to select multiple pixels.

</div>


<div id="canvasWrapper">

<div id="pixelCanvas"></div>

</div>


<div class="controls">

<button
id="claimButton"
disabled
type="button"
>
Continue With Selected Pixels
</button>

<button
id="clearButton"
type="button"
>
Clear Selection
</button>

</div>


<div class="note">

Select the exact area you want to design.
Your finished design will appear in the same location on the giant canvas.

</div>


<script>

const canvas =
  document.getElementById("pixelCanvas");

const selectedCount =
  document.getElementById("selectedCount");

const totalPrice =
  document.getElementById("totalPrice");

const claimButton =
  document.getElementById("claimButton");

const clearButton =
  document.getElementById("clearButton");


const GRID_WIDTH = 100;

const GRID_HEIGHT = 100;


const selectedPixels =
  new Set();


const claimedPixels =
  new Set();


let isDragging = false;

let dragMode = "select";


function pixelKey(x, y) {

  return `${x},${y}`;

}


function updateSelection() {

  const count =
    selectedPixels.size;

  selectedCount.textContent =
    count;

  totalPrice.textContent =
    count;

  claimButton.disabled =
    count === 0;

}


function selectPixel(x, y) {

  const key =
    pixelKey(x, y);

  if (claimedPixels.has(key)) {
    return;
  }

  const pixel =
    document.querySelector(
      `.pixel[data-key="${key}"]`
    );

  if (!pixel) {
    return;
  }


  if (dragMode === "select") {

    selectedPixels.add(key);

    pixel.classList.add("selected");

  } else {

    selectedPixels.delete(key);

    pixel.classList.remove("selected");

  }


  updateSelection();

}


function createCanvas() {

  canvas.innerHTML = "";

  const fragment =
    document.createDocumentFragment();


  for (
    let y = 0;
    y < GRID_HEIGHT;
    y++
  ) {

    for (
      let x = 0;
      x < GRID_WIDTH;
      x++
    ) {

      const pixel =
        document.createElement("div");

      const key =
        pixelKey(x, y);


      pixel.className =
        "pixel";

      pixel.dataset.x =
        x;

      pixel.dataset.y =
        y;

      pixel.dataset.key =
        key;


      if (
        claimedPixels.has(key)
      ) {

        pixel.classList.add(
          "claimed"
        );

      }


      pixel.addEventListener(
        "pointerdown",
        function(event) {

          if (
            claimedPixels.has(key)
          ) {

            return;

          }


          event.preventDefault();

          isDragging = true;


          dragMode =
            selectedPixels.has(key)
              ? "remove"
              : "select";


          selectPixel(x, y);

        }
      );


      pixel.addEventListener(
        "pointerenter",
        function() {

          if (!isDragging) {
            return;
          }

          selectPixel(x, y);

        }
      );


      fragment.appendChild(pixel);

    }

  }


  canvas.appendChild(fragment);

}


document.addEventListener(
  "pointerup",
  function() {

    isDragging = false;

  }
);


clearButton.addEventListener(
  "click",
  function() {

    selectedPixels.clear();

    document
      .querySelectorAll(".pixel.selected")
      .forEach(function(pixel) {

        pixel.classList.remove(
          "selected"
        );

      });

    updateSelection();

  }
);


claimButton.addEventListener(
  "click",
  function() {

    if (
      selectedPixels.size === 0
    ) {

      return;

    }


    const pixels =
      Array.from(selectedPixels);


    const pixelData =
      encodeURIComponent(
        JSON.stringify(pixels)
      );


    window.location.href =
      "design.html?pixels=" +
      pixelData;

  }
);


createCanvas();

updateSelection();

</script>

</body>
</html>
