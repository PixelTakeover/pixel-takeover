<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Design Your Pixels - Pixel Takeover</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #111;
  color: white;
}

header {
  text-align: center;
  padding: 25px 15px 10px;
}

h1 {
  margin: 0;
  font-size: 30px;
  letter-spacing: 2px;
}

.subtitle {
  margin-top: 8px;
  color: #aaa;
}

.info {
  text-align: center;
  padding: 12px;
  font-size: 18px;
}

/* =========================
   DESIGN AREA
========================= */

#workspaceWrapper {
  width: 100%;
  overflow: auto;
  padding: 15px;
}

#workspace {
  position: relative;
  margin: auto;
  overflow: hidden;
  border: 3px solid #555;
  min-width: 180px;
  min-height: 180px;
}

/* Individual purchased pixels */

.selectedPixel {
  position: absolute;
  border: 1px solid rgba(0,0,0,.15);
}

/* =========================
   DESIGN OBJECTS
========================= */

.designObject {
  position: absolute;
  transform: translate(-50%, -50%);
  cursor: move;
  user-select: none;
  touch-action: none;
  z-index: 10;
}

.designObject.selectedObject {
  outline: 2px dashed #111;
  outline-offset: 4px;
}

/* =========================
   CONTROLS
========================= */

.controls {
  max-width: 650px;
  margin: auto;
  padding: 20px;
}

.controlGroup {
  margin-bottom: 18px;
}

label {
  display: block;
  margin-bottom: 7px;
  font-weight: bold;
}

input,
select,
textarea {
  width: 100%;
  padding: 11px;
  border-radius: 7px;
  border: 1px solid #555;
  background: #222;
  color: white;
  font-size: 16px;
}

textarea {
  min-height: 75px;
  resize: vertical;
}

input[type="color"] {
  height: 48px;
  padding: 3px;
}

input[type="range"] {
  padding: 0;
}

.rangeValue {
  text-align: center;
  margin-top: 5px;
  color: #aaa;
}

button {
  border: none;
  border-radius: 8px;
  padding: 13px 18px;
  margin: 5px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}

#addTextButton {
  background: white;
  color: #111;
}

#addImageButton {
  background: #444;
  color: white;
}

#deleteButton {
  background: #822;
  color: white;
}

#saveButton {
  background: white;
  color: #111;
  width: calc(100% - 10px);
  margin-top: 20px;
}

#backButton {
  background: #444;
  color: white;
}

#imageFile {
  display: none;
}

/* =========================
   OBJECT LIST
========================= */

#objectList {
  margin-top: 20px;
}

.objectItem {
  background: #222;
  border: 1px solid #444;
  border-radius: 7px;
  padding: 11px;
  margin-bottom: 8px;
  cursor: pointer;
}

.objectItem.active {
  border-color: white;
}

.hint {
  color: #aaa;
  font-size: 13px;
  line-height: 1.5;
  margin-top: 15px;
}

</style>

</head>

<body>


<header>

<h1>DESIGN YOUR PIXELS</h1>

<div class="subtitle">
Make your space yours.
</div>

</header>


<div class="info">

You selected
<strong id="pixelCount">0</strong>
pixels.

</div>


<!-- =========================
     LIVE DESIGN WORKSPACE
========================= -->

<div id="workspaceWrapper">

<div id="workspace"></div>

</div>


<div class="controls">


<!-- DESIGN NAME -->

<div class="controlGroup">

<label for="designTitle">
Design Name
</label>

<input
id="designTitle"
type="text"
placeholder="Give your design a name"
/>

</div>


<!-- BACKGROUND COLOR -->

<div class="controlGroup">

<label for="backgroundColor">
Pixel Background Color
</label>

<input
id="backgroundColor"
type="color"
value="#ffffff"
/>

</div>


<!-- TEXT -->

<div class="controlGroup">

<label for="textInput">
Selected Text
</label>

<textarea
id="textInput"
placeholder="Add text to your space..."
></textarea>

</div>


<!-- FONT -->

<div class="controlGroup">

<label for="fontFamily">
Font
</label>

<select id="fontFamily">

<option value="Arial">
Arial
</option>

<option value="Verdana">
Verdana
</option>

<option value="Trebuchet MS">
Trebuchet MS
</option>

<option value="Georgia">
Georgia
</option>

<option value="Times New Roman">
Times New Roman
</option>

<option value="Courier New">
Courier New
</option>

<option value="Impact">
Impact - Extra Bold
</option>

<option value="Arial Black">
Arial Black - Bold
</option>

<option value="Comic Sans MS">
Comic Sans
</option>

<option value="cursive">
Cursive
</option>

<option value="fantasy">
Fantasy
</option>

<option value="serif">
Classic Serif
</option>

<option value="sans-serif">
Modern Sans
</option>

<option value="monospace">
Monospace
</option>

</select>

</div>


<!-- TEXT COLOR -->

<div class="controlGroup">

<label for="textColor">
Text Color
</label>

<input
id="textColor"
type="color"
value="#111111"
/>

</div>


<!-- FONT SIZE -->

<div class="controlGroup">

<label for="textSize">
Font Size
</label>

<input
id="textSize"
type="range"
min="8"
max="120"
value="30"
/>

<div class="rangeValue">
<span id="textSizeValue">30</span> px
</div>

</div>


<!-- ADD TEXT -->

<button
id="addTextButton"
type="button"
>
Add New Text
</button>


<!-- IMAGE -->

<button
id="addImageButton"
type="button"
>
Add Image / Logo
</button>

<input
id="imageFile"
type="file"
accept="image/*"
/>


<!-- OBJECTS -->

<div id="objectList"></div>


<!-- DELETE -->

<button
id="deleteButton"
type="button"
>
Delete Selected
</button>


<div class="hint">

<strong>How to design:</strong><br>
Tap "Add New Text" and begin typing.
Your text appears immediately inside your purchased pixels.
Select any item later to change its text, font, color, size, or position.
Drag text and images around your space.

</div>


<!-- SAVE -->

<button
id="saveButton"
type="button"
>
Save Design
</button>


<button
id="backButton"
type="button"
>
Back to Pixel Selection
</button>


</div>


<script>


/* ==================================================
   READ SELECTED PIXELS
================================================== */

const params =
  new URLSearchParams(
    window.location.search
  );

const pixelData =
  params.get("pixels");

let selectedPixels = [];


if (pixelData) {

  try {

    selectedPixels =
      JSON.parse(
        decodeURIComponent(pixelData)
      );

  } catch (error) {

    try {

      selectedPixels =
        JSON.parse(pixelData);

    } catch (secondError) {

      console.error(
        "Could not read selected pixels:",
        secondError
      );

    }

  }

}


/* ==================================================
   ELEMENTS
================================================== */

const pixelCount =
  document.getElementById(
    "pixelCount"
  );

const workspace =
  document.getElementById(
    "workspace"
  );

const designTitle =
  document.getElementById(
    "designTitle"
  );

const backgroundColor =
  document.getElementById(
    "backgroundColor"
  );

const textInput =
  document.getElementById(
    "textInput"
  );

const fontFamily =
  document.getElementById(
    "fontFamily"
  );

const textColor =
  document.getElementById(
    "textColor"
  );

const textSize =
  document.getElementById(
    "textSize"
  );

const textSizeValue =
  document.getElementById(
    "textSizeValue"
  );

const addTextButton =
  document.getElementById(
    "addTextButton"
  );

const addImageButton =
  document.getElementById(
    "addImageButton"
  );

const imageFile =
  document.getElementById(
    "imageFile"
  );

const deleteButton =
  document.getElementById(
    "deleteButton"
  );

const saveButton =
  document.getElementById(
    "saveButton"
  );

const backButton =
  document.getElementById(
    "backButton"
  );

const objectList =
  document.getElementById(
    "objectList"
  );


pixelCount.textContent =
  selectedPixels.length;


/* ==================================================
   FIND SELECTED PIXEL BOUNDARIES
================================================== */

function getCoordinates() {

  if (
    selectedPixels.length === 0
  ) {

    return {
      minX: 0,
      maxX: 4,
      minY: 0,
      maxY: 4
    };

  }


  const coordinates =
    selectedPixels.map(
      function(pixel) {

        const parts =
          pixel.split(",");

        return {

          x:
            Number(parts[0]),

          y:
            Number(parts[1])

        };

      }
    );


  return {

    minX:
      Math.min(
        ...coordinates.map(
          p => p.x
        )
      ),

    maxX:
      Math.max(
        ...coordinates.map(
          p => p.x
        )
      ),

    minY:
      Math.min(
        ...coordinates.map(
          p => p.y
        )
      ),

    maxY:
      Math.max(
        ...coordinates.map(
          p => p.y
        )
      )

  };

}


const bounds =
  getCoordinates();


const columns =
  bounds.maxX -
  bounds.minX +
  1;


const rows =
  bounds.maxY -
  bounds.minY +
  1;


/* ==================================================
   WORKSPACE
================================================== */

const PIXEL_SIZE = 40;


workspace.style.width =
  (columns * PIXEL_SIZE) +
  "px";


workspace.style.height =
  (rows * PIXEL_SIZE) +
  "px";


workspace.style.background =
  backgroundColor.value;


/* ==================================================
   DRAW PURCHASED PIXELS
================================================== */

function drawPixels() {

  workspace
    .querySelectorAll(".selectedPixel")
    .forEach(
      pixel =>
        pixel.remove()
    );


  selectedPixels.forEach(
    function(pixelKey) {

      const parts =
        pixelKey.split(",");

      const x =
        Number(parts[0]);

      const y =
        Number(parts[1]);


      const pixel =
        document.createElement("div");


      pixel.className =
        "selectedPixel";


      pixel.style.width =
        PIXEL_SIZE + "px";


      pixel.style.height =
        PIXEL_SIZE + "px";


      pixel.style.left =
        (
          (x - bounds.minX) *
          PIXEL_SIZE
        ) + "px";


      pixel.style.top =
        (
          (y - bounds.minY) *
          PIXEL_SIZE
        ) + "px";


      pixel.style.background =
        backgroundColor.value;


      workspace.appendChild(
        pixel
      );

    }
  );

}


/* ==================================================
   BACKGROUND COLOR
================================================== */

backgroundColor.addEventListener(
  "input",
  function() {

    drawPixels();

    workspace.style.background =
      backgroundColor.value;

    renderObjects();

  }
);


/* ==================================================
   DESIGN OBJECTS
================================================== */

let designObjects = [];

let selectedObjectId = null;

let nextObjectId = 1;


/* ==================================================
   ADD NEW TEXT
================================================== */

addTextButton.addEventListener(
  "click",
  function() {

    const object = {

      id:
        nextObjectId++,

      type:
        "text",

      text:
        "Type your text",

      fontFamily:
        fontFamily.value,

      color:
        textColor.value,

      size:
        Number(
          textSize.value
        ),

      x:
        50,

      y:
        50

    };


    designObjects.push(
      object
    );


    selectedObjectId =
      object.id;


    textInput.value =
      object.text;


    renderObjects();

    textInput.focus();

    textInput.select();

  }
);


/* ==================================================
   LIVE TEXT EDITING
================================================== */

textInput.addEventListener(
  "input",
  function() {

    const object =
      getSelectedTextObject();


    if (!object) {
      return;
    }


    object.text =
      textInput.value;


    renderObjects();

  }
);


/* ==================================================
   FONT LIVE CHANGE
================================================== */

fontFamily.addEventListener(
  "change",
  function() {

    const object =
      getSelectedTextObject();


    if (!object) {
      return;
    }


    object.fontFamily =
      fontFamily.value;


    renderObjects();

  }
);


/* ==================================================
   TEXT COLOR LIVE CHANGE
================================================== */

textColor.addEventListener(
  "input",
  function() {

    const object =
      getSelectedTextObject();


    if (!object) {
      return;
    }


    object.color =
      textColor.value;


    renderObjects();

  }
);


/* ==================================================
   FONT SIZE LIVE CHANGE
================================================== */

textSize.addEventListener(
  "input",
  function() {

    textSizeValue.textContent =
      textSize.value;


    const object =
      getSelectedTextObject();


    if (!object) {
      return;
    }


    object.size =
      Number(
        textSize.value
      );


    renderObjects();

  }
);


/* ==================================================
   GET SELECTED TEXT
================================================== */

function getSelectedTextObject() {

  return designObjects.find(
    function(object) {

      return (
        object.id ===
        selectedObjectId &&
        object.type ===
        "text"
      );

    }
  );

}


/* ==================================================
   RENDER OBJECTS
================================================== */

function renderObjects() {

  workspace
    .querySelectorAll(".designObject")
    .forEach(
      element =>
        element.remove()
    );


  designObjects.forEach(
    function(object) {

      const element =
        document.createElement("div");


      element.className =
        "designObject";


      if (
        object.id ===
        selectedObjectId
      ) {

        element.classList.add(
          "selectedObject"
        );

      }


      element.dataset.id =
        object.id;


      element.style.left =
        object.x + "%";


      element.style.top =
        object.y + "%";


      if (
        object.type ===
        "text"
      ) {

        element.textContent =
          object.text;


        element.style.fontFamily =
          object.fontFamily;


        element.style.color =
          object.color;


        element.style.fontSize =
          object.size + "px";


        element.style.fontWeight =
          "normal";

      }


      if (
        object.type ===
        "image"
      ) {

        const image =
          document.createElement(
            "img"
          );


        image.src =
          object.src;


        image.style.width =
          object.width + "px";


        image.style.maxWidth =
          "80%";


        image.style.maxHeight =
          "80%";


        image.draggable =
          false;


        element.appendChild(
          image
        );

      }


      element.addEventListener(
        "pointerdown",
        function(event) {

          event.preventDefault();

          selectedObjectId =
            object.id;


          loadObjectControls(
            object
          );


          startDrag(
            event,
            object
          );

        }
      );


      workspace.appendChild(
        element
      );

    }
  );


  renderObjectList();

}


/* ==================================================
   LOAD SELECTED OBJECT INTO CONTROLS
================================================== */

function loadObjectControls(
  object
) {

  if (
    object.type ===
    "text"
  ) {

    textInput.value =
      object.text;


    fontFamily.value =
      object.fontFamily;


    textColor.value =
      object.color;


    textSize.value =
      object.size;


    textSizeValue.textContent =
      object.size;

  }

}


/* ==================================================
   OBJECT LIST
================================================== */

function renderObjectList() {

  objectList.innerHTML = "";


  designObjects.forEach(
    function(object) {

      const item =
        document.createElement(
          "div"
        );


      item.className =
        "objectItem";


      if (
        object.id ===
        selectedObjectId
      ) {

        item.classList.add(
          "active"
        );

      }


      if (
        object.type ===
        "text"
      ) {

        item.textContent =
          "Text: " +
          object.text;

      } else {

        item.textContent =
          "Image / Logo";

      }


      item.addEventListener(
        "click",
        function() {

          selectedObjectId =
            object.id;


          loadObjectControls(
            object
          );


          renderObjects();

        }
      );


      objectList.appendChild(
        item
      );

    }
  );

}


/* ==================================================
   ADD IMAGE / LOGO
================================================== */

addImageButton.addEventListener(
  "click",
  function() {

    imageFile.click();

  }
);


imageFile.addEventListener(
  "change",
  function() {

    const file =
      imageFile.files[0];


    if (!file) {
      return;
    }


    const reader =
      new FileReader();


    reader.onload =
      function(event) {

        const object = {

          id:
            nextObjectId++,

          type:
            "image",

          src:
            event.target.result,

          width:
            120,

          x:
            50,

          y:
            50

        };


        designObjects.push(
          object
        );


        selectedObjectId =
          object.id;


        renderObjects();

      };


    reader.readAsDataURL(
      file
    );

  }
);


/* ==================================================
   DRAGGING
================================================== */

let draggingObject = null;

let dragStartX = 0;

let dragStartY = 0;

let originalX = 0;

let originalY = 0;


function startDrag(
  event,
  object
) {

  draggingObject =
    object;


  dragStartX =
    event.clientX;


  dragStartY =
    event.clientY;


  originalX =
    object.x;


  originalY =
    object.y;


  document.addEventListener(
    "pointermove",
    dragMove
  );


  document.addEventListener(
    "pointerup",
    endDrag,
    {
      once: true
    }
  );

}


function dragMove(event) {

  if (!draggingObject) {
    return;
  }


  const rect =
    workspace.getBoundingClientRect();


  const changeX =
    (
      event.clientX -
      dragStartX
    ) /
    rect.width *
    100;


  const changeY =
    (
      event.clientY -
      dragStartY
    ) /
    rect.height *
    100;


  draggingObject.x =
    Math.max(
      0,
      Math.min(
        100,
        originalX +
        changeX
      )
    );


  draggingObject.y =
    Math.max(
      0,
      Math.min(
        100,
        originalY +
        changeY
      )
    );


  renderObjects();

}


/* ==================================================
   END DRAG
================================================== */

function endDrag() {

  draggingObject =
    null;


  document.removeEventListener(
    "pointermove",
    dragMove
  );

}


/* ==================================================
   DELETE SELECTED OBJECT
================================================== */

deleteButton.addEventListener(
  "click",
  function() {

    if (
      selectedObjectId === null
    ) {

      return;

    }


    designObjects =
      designObjects.filter(
        function(object) {

          return (
            object.id !==
            selectedObjectId
          );

        }
      );


    selectedObjectId =
      null;


    textInput.value = "";


    renderObjects();

  }
);


/* ==================================================
   SAVE DESIGN
================================================== */

saveButton.addEventListener(
  "click",
  function() {

    if (
      selectedPixels.length === 0
    ) {

      alert(
        "No pixels were selected."
      );

      return;

    }


    if (
      designObjects.length === 0
    ) {

      alert(
        "Add some text or an image first."
      );

      return;

    }


    const design = {

      title:
        designTitle.value,

      backgroundColor:
        backgroundColor.value,

      selectedPixels:
        selectedPixels,

      objects:
        designObjects

    };


    console.log(
      "PIXEL TAKEOVER DESIGN:",
      design
    );


    alert(
      "Your design is ready to save! Permanent saving and payment will be connected next."
    );

  }
);


/* ==================================================
   BACK
================================================== */

backButton.addEventListener(
  "click",
  function() {

    window.location.href =
      "./index.html";

  }
);


/* ==================================================
   START
================================================== */

drawPixels();

renderObjects();

textSizeValue.textContent =
  textSize.value;

</script>

</body>
</html>
