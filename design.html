<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel Takeover - Design Your Pixels</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #111;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  text-align: center;
  padding: 18px 12px 10px;
}

h1 {
  margin: 0 0 5px;
  font-size: 28px;
}

.subtitle {
  margin: 0;
  color: #aaa;
}

/* PREVIEW FIRST */
.preview-section {
  padding: 10px 12px 18px;
}

.preview-title {
  text-align: center;
  margin: 0 0 10px;
  font-weight: bold;
  font-size: 18px;
}

.workspace-wrapper {
  width: 100%;
  overflow: auto;
  background: #050505;
  border-radius: 12px;
  padding: 12px;
}

#workspace {
  position: relative;
  margin: auto;
  overflow: hidden;
  background: #222;
}

/* SELECTED PIXELS */
.pixel {
  position: absolute;
  border: 1px solid rgba(255,255,255,.15);
}

/* DESIGN OBJECTS */
.design-object {
  position: absolute;
  transform: translate(-50%, -50%);
  cursor: move;
  user-select: none;
  touch-action: none;
  white-space: pre;
}

.design-object.active {
  outline: 2px dashed white;
  outline-offset: 4px;
}

/* CONTROLS */
.container {
  max-width: 900px;
  margin: auto;
  padding: 0 12px 30px;
}

.controls {
  background: #1d1d1d;
  border-radius: 12px;
  padding: 18px;
}

.selected-count {
  text-align: center;
  font-weight: bold;
  margin-bottom: 18px;
  font-size: 17px;
}

label {
  display: block;
  margin: 14px 0 6px;
  font-weight: bold;
}

textarea {
  width: 100%;
  min-height: 70px;
  padding: 12px;
  border-radius: 8px;
  border: 1px solid #555;
  background: #111;
  color: white;
  font-size: 18px;
  resize: vertical;
}

select {
  width: 100%;
  padding: 11px;
  border-radius: 8px;
  background: #111;
  color: white;
  border: 1px solid #555;
  font-size: 16px;
}

input[type="color"] {
  width: 60px;
  height: 42px;
  border: none;
  background: transparent;
}

.range-row {
  display: flex;
  align-items: center;
  gap: 12px;
}

.range-row input {
  flex: 1;
}

#sizeValue,
#imageSizeValue {
  min-width: 65px;
  font-weight: bold;
}

.button-row {
  display: flex;
  flex-wrap: wrap;
  gap: 9px;
  margin-top: 18px;
}

button {
  border: none;
  border-radius: 8px;
  padding: 13px 15px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}

#addToPixels {
  background: #00c853;
  color: white;
}

#addImage {
  background: #444;
  color: white;
}

#deleteSelected {
  background: #b71c1c;
  color: white;
}

#backButton {
  background: #333;
  color: white;
}

#saveDesign {
  width: 100%;
  margin-top: 15px;
  background: #7c4dff;
  color: white;
}

#imageControls {
  display: none;
}

#imageInput {
  display: none;
}

#objectList {
  margin-top: 20px;
}

.object-heading {
  font-weight: bold;
  margin-bottom: 8px;
}

.object-item {
  padding: 11px;
  margin-top: 7px;
  background: #292929;
  border-radius: 7px;
  cursor: pointer;
}

.object-item.active {
  background: #555;
}

.help {
  color: #aaa;
  font-size: 13px;
  margin-top: 7px;
}
</style>
</head>

<body>

<header>
  <h1>Design Your Pixels</h1>
  <p class="subtitle">Make your space yours.</p>
</header>


<!-- =========================
     PREVIEW AT THE TOP
========================= -->

<section class="preview-section">

  <p class="preview-title">
    YOUR PIXEL PREVIEW
  </p>

  <div class="workspace-wrapper">
    <div id="workspace"></div>
  </div>

</section>


<div class="container">

  <div class="controls">

    <div class="selected-count">
      Selected Pixels:
      <span id="pixelCount">0</span>
    </div>


    <!-- LIVE TEXT -->

    <label for="textInput">
      Type Your Text
    </label>

    <textarea
      id="textInput"
      placeholder="Start typing and watch it appear in your pixels..."
      autofocus
    ></textarea>

    <div class="help">
      Your text appears immediately while you type.
    </div>


    <label for="fontFamily">
      Font
    </label>

    <select id="fontFamily">
      <option value="Arial">Arial</option>
      <option value="Arial Black">Arial Black - Bold</option>
      <option value="Impact">Impact - Extra Bold</option>
      <option value="Verdana">Verdana</option>
      <option value="Trebuchet MS">Trebuchet MS</option>
      <option value="Georgia">Georgia</option>
      <option value="Times New Roman">Times New Roman</option>
      <option value="Courier New">Courier New</option>
      <option value="Comic Sans MS">Comic Sans</option>
      <option value="Cursive">Cursive</option>
      <option value="Fantasy">Fantasy</option>
      <option value="serif">Classic Serif</option>
      <option value="sans-serif">Modern Sans</option>
      <option value="monospace">Monospace</option>
    </select>


    <label for="textColor">
      Text Color
    </label>

    <input
      type="color"
      id="textColor"
      value="#ffffff"
    >


    <label for="textSize">
      Text Size
    </label>

    <div class="range-row">

      <input
        type="range"
        id="textSize"
        min="8"
        max="120"
        value="40"
      >

      <span id="sizeValue">
        40 px
      </span>

    </div>


    <label for="backgroundColor">
      Pixel Background Color
    </label>

    <input
      type="color"
      id="backgroundColor"
      value="#222222"
    >


    <!-- IMAGE CONTROLS -->

    <div id="imageControls">

      <label for="imageSize">
        Image Size
      </label>

      <div class="range-row">

        <input
          type="range"
          id="imageSize"
          min="20"
          max="500"
          value="150"
        >

        <span id="imageSizeValue">
          150 px
        </span>

      </div>

      <div class="help">
        Select an image in the preview, then resize it here.
      </div>

    </div>


    <!-- BUTTONS -->

    <div class="button-row">

      <button id="addToPixels">
        ADD TO PIXELS
      </button>

      <button id="addImage">
        ADD IMAGE
      </button>

      <button id="deleteSelected">
        DELETE SELECTED
      </button>

      <button id="backButton">
        GO BACK
      </button>

    </div>


    <input
      type="file"
      id="imageInput"
      accept="image/*"
    >


    <!-- ADDED ITEMS -->

    <div id="objectList"></div>


    <button id="saveDesign">
      SAVE PIXEL DESIGN
    </button>

  </div>

</div>


<script>

/* =========================
   READ SELECTED PIXELS
========================= */

const params =
  new URLSearchParams(window.location.search);

const pixelData =
  params.get("pixels");

let selectedPixels = [];

if (pixelData) {

  try {

    selectedPixels =
      JSON.parse(
        decodeURIComponent(pixelData)
      );

  } catch (error) {

    try {

      selectedPixels =
        JSON.parse(pixelData);

    } catch (secondError) {

      console.error(
        "Could not read selected pixels:",
        secondError
      );

    }

  }

}


document.getElementById("pixelCount")
  .textContent =
  selectedPixels.length;


/* =========================
   ELEMENTS
========================= */

const workspace =
  document.getElementById("workspace");

const textInput =
  document.getElementById("textInput");

const fontFamily =
  document.getElementById("fontFamily");

const textColor =
  document.getElementById("textColor");

const textSize =
  document.getElementById("textSize");

const sizeValue =
  document.getElementById("sizeValue");

const backgroundColor =
  document.getElementById("backgroundColor");

const addToPixels =
  document.getElementById("addToPixels");

const addImage =
  document.getElementById("addImage");

const imageInput =
  document.getElementById("imageInput");

const deleteSelected =
  document.getElementById("deleteSelected");

const saveDesign =
  document.getElementById("saveDesign");

const backButton =
  document.getElementById("backButton");

const objectList =
  document.getElementById("objectList");

const imageControls =
  document.getElementById("imageControls");

const imageSize =
  document.getElementById("imageSize");

const imageSizeValue =
  document.getElementById("imageSizeValue");


/* =========================
   SETTINGS
========================= */

const PIXEL_SIZE = 40;

let designObjects = [];

let nextObjectId = 1;

let selectedObjectId = null;

let liveTextObject = null;

let draggingObject = null;

let dragOffsetX = 0;

let dragOffsetY = 0;


/* =========================
   PIXEL BOUNDS
========================= */

function getPixelBounds() {

  if (!selectedPixels.length) {

    return {
      minX: 0,
      maxX: 0,
      minY: 0,
      maxY: 0
    };

  }


  const coords =
    selectedPixels.map(key => {

      const parts =
        key.split(",");

      return {
        x: Number(parts[0]),
        y: Number(parts[1])
      };

    });


  return {

    minX:
      Math.min(
        ...coords.map(p => p.x)
      ),

    maxX:
      Math.max(
        ...coords.map(p => p.x)
      ),

    minY:
      Math.min(
        ...coords.map(p => p.y)
      ),

    maxY:
      Math.max(
        ...coords.map(p => p.y)
      )

  };

}


/* =========================
   DRAW PIXELS
========================= */

function drawPixels() {

  workspace.innerHTML = "";

  const bounds =
    getPixelBounds();

  const columns =
    bounds.maxX -
    bounds.minX + 1;

  const rows =
    bounds.maxY -
    bounds.minY + 1;


  workspace.style.width =
    (columns * PIXEL_SIZE) + "px";

  workspace.style.height =
    (rows * PIXEL_SIZE) + "px";


  selectedPixels.forEach(key => {

    const parts =
      key.split(",");

    const x =
      Number(parts[0]);

    const y =
      Number(parts[1]);


    const pixel =
      document.createElement("div");

    pixel.className =
      "pixel";


    pixel.style.width =
      PIXEL_SIZE + "px";

    pixel.style.height =
      PIXEL_SIZE + "px";


    pixel.style.left =
      ((x - bounds.minX) *
        PIXEL_SIZE) + "px";


    pixel.style.top =
      ((y - bounds.minY) *
        PIXEL_SIZE) + "px";


    pixel.style.background =
      backgroundColor.value;


    workspace.appendChild(pixel);

  });


  renderObjects();

}


/* =========================
   CREATE LIVE TEXT
========================= */

function createLiveText() {

  if (liveTextObject) {
    return;
  }


  liveTextObject = {

    id:
      nextObjectId++,

    type:
      "text",

    text:
      "",

    fontFamily:
      fontFamily.value,

    color:
      textColor.value,

    size:
      Number(textSize.value),

    x:
      50,

    y:
      50,

    live:
      true

  };


  selectedObjectId =
    liveTextObject.id;

}


/* =========================
   LIVE TYPING
========================= */

textInput.addEventListener(
  "input",
  function() {

    createLiveText();


    liveTextObject.text =
      textInput.value;


    liveTextObject.fontFamily =
      fontFamily.value;


    liveTextObject.color =
      textColor.value;


    liveTextObject.size =
      Number(textSize.value);


    renderObjects();

  }
);


/* =========================
   FONT
========================= */

fontFamily.addEventListener(
  "change",
  function() {

    if (!liveTextObject) {
      return;
    }


    liveTextObject.fontFamily =
      fontFamily.value;


    renderObjects();

  }
);


/* =========================
   TEXT COLOR
========================= */

textColor.addEventListener(
  "input",
  function() {

    if (!liveTextObject) {
      return;
    }


    liveTextObject.color =
      textColor.value;


    renderObjects();

  }
);


/* =========================
   TEXT SIZE
========================= */

textSize.addEventListener(
  "input",
  function() {

    sizeValue.textContent =
      textSize.value + " px";


    if (!liveTextObject) {
      return;
    }


    liveTextObject.size =
      Number(textSize.value);


    renderObjects();

  }
);


/* =========================
   BACKGROUND COLOR
========================= */

backgroundColor.addEventListener(
  "input",
  function() {

    drawPixels();

  }
);


/* =========================
   RENDER OBJECTS
========================= */

function renderObjects() {

  document
    .querySelectorAll(".design-object")
    .forEach(el => el.remove());


  const objects = [
    ...designObjects
  ];


  if (
    liveTextObject &&
    liveTextObject.text.length > 0
  ) {

    objects.push(
      liveTextObject
    );

  }


  objects.forEach(
    function(object) {


      /* TEXT */

      if (
        object.type === "text"
      ) {

        if (!object.text) {
          return;
        }


        const element =
          document.createElement("div");


        element.className =
          "design-object";


        if (
          object.id === selectedObjectId
        ) {

          element.classList.add(
            "active"
          );

        }


        element.textContent =
          object.text;


        element.style.left =
          object.x + "%";


        element.style.top =
          object.y + "%";


        element.style.fontFamily =
          object.fontFamily;


        element.style.color =
          object.color;


        element.style.fontSize =
          object.size + "px";


        element.dataset.id =
          object.id;


        addDragEvents(
          element,
          object
        );


        workspace.appendChild(
          element
        );

      }


      /* IMAGE */

      if (
        object.type === "image"
      ) {

        const element =
          document.createElement("img");


        element.className =
          "design-object";


        element.src =
          object.src;


        element.style.left =
          object.x + "%";


        element.style.top =
          object.y + "%";


        element.style.width =
          object.width + "px";


        element.style.height =
          "auto";


        element.dataset.id =
          object.id;


        if (
          object.id === selectedObjectId
        ) {

          element.classList.add(
            "active"
          );

        }


        addDragEvents(
          element,
          object
        );


        workspace.appendChild(
          element
        );

      }

    }
  );


  updateObjectList();

  updateImageControls();

}


/* =========================
   DRAGGING
========================= */

function addDragEvents(
  element,
  object
) {

  element.addEventListener(
    "pointerdown",
    function(event) {

      event.preventDefault();

      selectedObjectId =
        object.id;


      if (
        object.type === "text"
      ) {

        liveTextObject =
          object;

        textInput.value =
          object.text;

        fontFamily.value =
          object.fontFamily;

        textColor.value =
          object.color;

        textSize.value =
          object.size;

        sizeValue.textContent =
          object.size + " px";

      }


      const rect =
        workspace.getBoundingClientRect();


      dragOffsetX =
        event.clientX -
        rect.left -
        (
          object.x / 100 *
          rect.width
        );


      dragOffsetY =
        event.clientY -
        rect.top -
        (
          object.y / 100 *
          rect.height
        );


      draggingObject =
        object;


      renderObjects();

    }
  );

}


document.addEventListener(
  "pointermove",
  function(event) {

    if (!draggingObject) {
      return;
    }


    const rect =
      workspace.getBoundingClientRect();


    let x =
      event.clientX -
      rect.left -
      dragOffsetX;


    let y =
      event.clientY -
      rect.top -
      dragOffsetY;


    x =
      Math.max(
        0,
        Math.min(
          rect.width,
          x
        )
      );


    y =
      Math.max(
        0,
        Math.min(
          rect.height,
          y
        )
      );


    draggingObject.x =
      (x / rect.width) * 100;


    draggingObject.y =
      (y / rect.height) * 100;


    renderObjects();

  }
);


document.addEventListener(
  "pointerup",
  function() {

    draggingObject =
      null;

  }
);


/* =========================
   ADD TO PIXELS
========================= */

addToPixels.addEventListener(
  "click",
  function() {

    if (
      !liveTextObject ||
      !liveTextObject.text.trim()
    ) {

      alert(
        "Type something first."
      );

      textInput.focus();

      return;

    }


    liveTextObject.live =
      false;


    designObjects.push(
      liveTextObject
    );


    liveTextObject =
      null;


    selectedObjectId =
      null;


    textInput.value =
      "";


    renderObjects();


    textInput.focus();

  }
);


/* =========================
   ADD IMAGE
========================= */

addImage.addEventListener(
  "click",
  function() {

    imageInput.click();

  }
);


imageInput.addEventListener(
  "change",
  function() {

    const file =
      imageInput.files[0];

    if (!file) {
      return;
    }


    const reader =
      new FileReader();


    reader.onload =
      function(event) {

        const imageObject = {

          id:
            nextObjectId++,

          type:
            "image",

          src:
            event.target.result,

          x:
            50,

          y:
            50,

          width:
            150

        };


        designObjects.push(
          imageObject
        );


        selectedObjectId =
          imageObject.id;


        renderObjects();

      };


    reader.readAsDataURL(file);

  }
);


/* =========================
   IMAGE RESIZE
========================= */

imageSize.addEventListener(
  "input",
  function() {

    imageSizeValue.textContent =
      imageSize.value + " px";


    const object =
      getSelectedObject();


    if (
      !object ||
      object.type !== "image"
    ) {
      return;
    }


    object.width =
      Number(imageSize.value);


    renderObjects();

  }
);


/* =========================
   DELETE SELECTED
========================= */

deleteSelected.addEventListener(
  "click",
  function() {

    if (
      !selectedObjectId
    ) {

      alert(
        "Select a text or image first."
      );

      return;

    }


    if (
      liveTextObject &&
      liveTextObject.id ===
      selectedObjectId
    ) {

      liveTextObject =
        null;

      textInput.value =
        "";

      selectedObjectId =
        null;

      renderObjects();

      textInput.focus();

      return;

    }


    designObjects =
      designObjects.filter(
        object =>
          object.id !==
          selectedObjectId
      );


    selectedObjectId =
      null;


    renderObjects();

  }
);


/* =========================
   GET SELECTED OBJECT
========================= */

function getSelectedObject() {

  if (!selectedObjectId) {
    return null;
  }


  if (
    liveTextObject &&
    liveTextObject.id ===
    selectedObjectId
  ) {

    return liveTextObject;

  }


  return designObjects.find(
    object =>
      object.id ===
      selectedObjectId
  ) || null;

}


/* =========================
   IMAGE CONTROLS
========================= */

function updateImageControls() {

  const object =
    getSelectedObject();


  if (
    object &&
    object.type === "image"
  ) {

    imageControls.style.display =
      "block";


    imageSize.value =
      object.width;


    imageSizeValue.textContent =
      object.width + " px";

  } else {

    imageControls.style.display =
      "none";

  }

}


/* =========================
   OBJECT LIST
========================= */

function updateObjectList() {

  objectList.innerHTML = "";


  if (!designObjects.length) {
    return;
  }


  const heading =
    document.createElement("div");


  heading.className =
    "object-heading";


  heading.textContent =
    "Your Added Items";


  objectList.appendChild(
    heading
  );


  designObjects.forEach(
    function(object, index) {

      const item =
        document.createElement("div");


      item.className =
        "object-item";


      if (
        object.id ===
        selectedObjectId
      ) {

        item.classList.add(
          "active"
        );

      }


      if (
        object.type === "text"
      ) {

        item.textContent =
          (index + 1) +
          ". " +
          object.text;

      } else {

        item.textContent =
          (index + 1) +
          ". Image";

      }


      item.addEventListener(
        "click",
        function() {

          selectedObjectId =
            object.id;


          if (
            object.type === "text"
          ) {

            liveTextObject =
              object;

            textInput.value =
              object.text;

            fontFamily.value =
              object.fontFamily;

            textColor.value =
              object.color;

            textSize.value =
              object.size;

            sizeValue.textContent =
              object.size + " px";

          }


          renderObjects();

        }
      );


      objectList.appendChild(
        item
      );

    }
  );

}


/* =========================
   SAVE
========================= */

saveDesign.addEventListener(
  "click",
  function() {

    if (
      liveTextObject &&
      liveTextObject.text.trim()
    ) {

      alert(
        "Please tap ADD TO PIXELS for your current text before saving."
      );

      return;

    }


    const design = {

      selectedPixels:
        selectedPixels,

      backgroundColor:
        backgroundColor.value,

      objects:
        designObjects

    };


    console.log(
      "PIXEL DESIGN:",
      design
    );


    alert(
      "Your pixel design is ready for checkout. Checkout will be connected next."
    );

  }
);


/* =========================
   BACK
========================= */

backButton.addEventListener(
  "click",
  function() {

    window.location.href =
      "./index.html";

  }
);


/* =========================
   START
========================= */

drawPixels();

textInput.focus();

</script>

</body>
</html>
