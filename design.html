<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Design Your Pixels - Pixel Takeover</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #111;
  color: white;
  text-align: center;
}

header {
  padding: 25px 15px 10px;
}

h1 {
  margin: 0;
  font-size: 30px;
  letter-spacing: 2px;
}

.subtitle {
  margin-top: 10px;
  opacity: .8;
}

#selectedInfo {
  margin: 20px;
  font-size: 18px;
}

.editor {
  width: 92%;
  max-width: 700px;
  margin: 20px auto;
  padding: 20px;
  background: #222;
  border-radius: 12px;
}

label {
  display: block;
  text-align: left;
  margin-bottom: 8px;
  font-weight: bold;
}

input,
textarea,
select {
  width: 100%;
  padding: 12px;
  margin-bottom: 20px;
  border-radius: 8px;
  border: none;
  font-size: 16px;
}

textarea {
  min-height: 100px;
  resize: vertical;
}

.colorRow {
  display: flex;
  gap: 15px;
  margin-bottom: 20px;
}

.colorBox {
  flex: 1;
  text-align: left;
}

input[type="color"] {
  width: 100%;
  height: 55px;
  padding: 4px;
  cursor: pointer;
}

input[type="range"] {
  padding: 0;
  cursor: pointer;
}

#preview {
  position: relative;
  margin: 25px auto;
  width: 100%;
  min-height: 250px;
  border: 2px dashed #666;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  background: #ffffff;
}

#previewImage {
  max-width: 90%;
  max-height: 220px;
  display: none;
  object-fit: contain;
}

#previewMessage {
  position: absolute;
  max-width: 90%;
  word-wrap: break-word;
  font-size: 28px;
  font-weight: bold;
  pointer-events: none;
}

#previewPlaceholder {
  color: #777;
}

button {
  border: none;
  border-radius: 8px;
  padding: 14px 24px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  margin: 5px;
}

#saveButton {
  background: white;
  color: #111;
}

#backButton {
  background: #444;
  color: white;
}

.note {
  padding: 10px 25px 30px;
  font-size: 13px;
  opacity: .7;
}
</style>
</head>

<body>

<header>

<h1>DESIGN YOUR PIXELS</h1>

<div class="subtitle">
Make the space you claimed yours.
</div>

</header>

<div id="selectedInfo">
Pixels selected: <strong id="pixelCount">0</strong>
</div>

<div class="editor">

<label for="title">
Design Title
</label>

<input
type="text"
id="title"
placeholder="Give your creation a name"
>

<label for="message">
Your Message
</label>

<textarea
id="message"
placeholder="Add your message, business name, idea, artwork, or anything you want."
></textarea>


<div class="colorRow">

<div class="colorBox">

<label for="backgroundColor">
Background Color
</label>

<input
type="color"
id="backgroundColor"
value="#ffffff"
>

</div>


<div class="colorBox">

<label for="textColor">
Message Color
</label>

<input
type="color"
id="textColor"
value="#111111"
>

</div>

</div>


<label for="textSize">
Message Size
</label>

<input
type="range"
id="textSize"
min="12"
max="60"
value="28"
>


<label for="image">
Upload Your Design
</label>

<input
type="file"
id="image"
accept="image/*"
>


<div id="preview">

<div id="previewPlaceholder">
Your design preview will appear here
</div>

<img
id="previewImage"
alt="Design preview"
>

<div id="previewMessage"></div>

</div>


<button id="saveButton">
Save My Design
</button>

<button id="backButton">
Go Back
</button>

</div>

<div class="note">
Your design will become part of the growing Pixel Takeover canvas.
</div>


<script>

const params =
new URLSearchParams(window.location.search);

const pixelData =
params.get("pixels");

let selectedPixels = [];

if (pixelData) {

try {

selectedPixels =
JSON.parse(
decodeURIComponent(pixelData)
);

} catch (error) {

console.error(
"Could not read selected pixels:",
error
);

}

}

document.getElementById(
"pixelCount"
).textContent =
selectedPixels.length;


const message =
document.getElementById("message");

const backgroundColor =
document.getElementById("backgroundColor");

const textColor =
document.getElementById("textColor");

const textSize =
document.getElementById("textSize");

const preview =
document.getElementById("preview");

const previewMessage =
document.getElementById("previewMessage");

const previewPlaceholder =
document.getElementById("previewPlaceholder");

const imageInput =
document.getElementById("image");

const previewImage =
document.getElementById("previewImage");


function updatePreview() {

preview.style.backgroundColor =
backgroundColor.value;

previewMessage.textContent =
message.value;

previewMessage.style.color =
textColor.value;

previewMessage.style.fontSize =
textSize.value + "px";

if (
message.value ||
previewImage.style.display === "block"
) {

previewPlaceholder.style.display =
"none";

} else {

previewPlaceholder.style.display =
"block";

}

}


message.addEventListener(
"input",
updatePreview
);


backgroundColor.addEventListener(
"input",
updatePreview
);


textColor.addEventListener(
"input",
updatePreview
);


textSize.addEventListener(
"input",
updatePreview
);


imageInput.addEventListener(
"change",
function() {

const file =
this.files[0];

if (!file) {
return;
}

const reader =
new FileReader();

reader.onload =
function(event) {

previewImage.src =
event.target.result;

previewImage.style.display =
"block";

updatePreview();

};

reader.readAsDataURL(file);

});


document.getElementById(
"saveButton"
).addEventListener(
"click",
function() {

if (
!message.value &&
!imageInput.files[0]
) {

alert(
"Please add a message or upload a design first."
);

return;

}

alert(
"Your design is ready! " +
selectedPixels.length +
" pixels are selected."
);

});


document.getElementById(
"backButton"
).addEventListener(
"click",
function() {

window.location.href =
"index.html";

});


updatePreview();

</script>

</body>
</html>
