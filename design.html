<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pixel Takeover - Design Your Pixels</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #111;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  text-align: center;
  padding: 18px 12px 10px;
}

h1 {
  margin: 0 0 5px;
  font-size: 28px;
}

.subtitle {
  margin: 0;
  color: #aaa;
}

/* =========================
   PREVIEW
========================= */

.preview-section {
  padding: 10px 12px 18px;
}

.preview-title {
  text-align: center;
  margin: 0 0 10px;
  font-weight: bold;
  font-size: 18px;
}

.workspace-wrapper {
  width: 100%;
  overflow: auto;
  background: #050505;
  border-radius: 12px;
  padding: 12px;
}

#workspace {
  position: relative;
  margin: auto;
}

/*
  The pixel cells themselves.
*/
.pixel {
  position: absolute;
  border: 1px solid rgba(255,255,255,.15);
}

/*
  This layer holds text and images.

  The JavaScript creates a mask containing ONLY
  the pixels the customer selected.
*/
#designLayer {
  position: absolute;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;

  overflow: hidden;

  -webkit-mask-repeat: no-repeat;
  -webkit-mask-position: 0 0;
  -webkit-mask-size: 100% 100%;

  mask-repeat: no-repeat;
  mask-position: 0 0;
  mask-size: 100% 100%;
}

.design-object {
  position: absolute;
  transform: translate(-50%, -50%);
  cursor: move;
  user-select: none;
  touch-action: none;
  white-space: pre;
}

.design-object.active {
  outline: 2px dashed white;
  outline-offset: 4px;
}

.design-image {
  display: block;
  height: auto;
}

/* =========================
   CONTROLS
========================= */

.container {
  max-width: 900px;
  margin: auto;
  padding: 0 12px 30px;
}

.controls {
  background: #1d1d1d;
  border-radius: 12px;
  padding: 18px;
}

.selected-count {
  text-align: center;
  font-weight: bold;
  margin-bottom: 18px;
  font-size: 17px;
}

label {
  display: block;
  margin: 14px 0 6px;
  font-weight: bold;
}

textarea {
  width: 100%;
  min-height: 70px;
  padding: 12px;
  border-radius: 8px;
  border: 1px solid #555;
  background: #111;
  color: white;
  font-size: 18px;
  resize: vertical;
}

select {
  width: 100%;
  padding: 11px;
  border-radius: 8px;
  background: #111;
  color: white;
  border: 1px solid #555;
  font-size: 16px;
}

input[type="color"] {
  width: 60px;
  height: 42px;
  border: none;
  background: transparent;
}

.range-row {
  display: flex;
  align-items: center;
  gap: 12px;
}

.range-row input {
  flex: 1;
}

#sizeValue,
#imageSizeValue {
  min-width: 65px;
  font-weight: bold;
}

.button-row {
  display: flex;
  flex-wrap: wrap;
  gap: 9px;
  margin-top: 18px;
}

button {
  border: none;
  border-radius: 8px;
  padding: 13px 15px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}

#addToPixels {
  background: #00c853;
  color: white;
}

#addImage {
  background: #444;
  color: white;
}

#deleteSelected {
  background: #b71c1c;
  color: white;
}

#backButton {
  background: #333;
  color: white;
}

#saveDesign {
  width: 100%;
  margin-top: 15px;
  background: #7c4dff;
  color: white;
}

#imageControls {
  display: none;
}

#imageInput {
  display: none;
}

#objectList {
  margin-top: 20px;
}

.object-heading {
  font-weight: bold;
  margin-bottom: 8px;
}

.object-item {
  padding: 11px;
  margin-top: 7px;
  background: #292929;
  border-radius: 7px;
  cursor: pointer;
}

.object-item.active {
  background: #555;
}

.help {
  color: #aaa;
  font-size: 13px;
  margin-top: 7px;
}

.empty-message {
  text-align: center;
  color: #aaa;
  padding: 30px 10px;
}

</style>
</head>

<body>

<header>

  <h1>Design Your Pixels</h1>

  <p class="subtitle">
    Make your space yours.
  </p>

</header>


<!-- =========================
     PREVIEW AT TOP
========================= -->

<section class="preview-section">

  <p class="preview-title">
    YOUR PIXEL PREVIEW
  </p>

  <div class="workspace-wrapper">

    <div id="workspace">

      <div id="designLayer"></div>

    </div>

  </div>

</section>


<div class="container">

  <div class="controls">

    <div class="selected-count">

      Selected Pixels:
      <span id="pixelCount">0</span>

    </div>


    <!-- =========================
         TEXT
    ========================= -->

    <label for="textInput">
      Type Your Text
    </label>

    <textarea
      id="textInput"
      placeholder="Start typing and watch it appear in your pixels..."
      autofocus
    ></textarea>

    <div class="help">
      Your text appears immediately while you type.
    </div>


    <!-- =========================
         FONT
    ========================= -->

    <label for="fontFamily">
      Font
    </label>

    <select id="fontFamily">

      <option value="Arial">
        Arial
      </option>

      <option value="Arial Black">
        Arial Black - Bold
      </option>

      <option value="Impact">
        Impact - Extra Bold
      </option>

      <option value="Verdana">
        Verdana
      </option>

      <option value="Trebuchet MS">
        Trebuchet MS
      </option>

      <option value="Georgia">
        Georgia
      </option>

      <option value="Times New Roman">
        Times New Roman
      </option>

      <option value="Courier New">
        Courier New
      </option>

      <option value="Comic Sans MS">
        Comic Sans
      </option>

      <option value="Cursive">
        Cursive
      </option>

      <option value="Fantasy">
        Fantasy
      </option>

      <option value="serif">
        Classic Serif
      </option>

      <option value="sans-serif">
        Modern Sans
      </option>

      <option value="monospace">
        Monospace
      </option>

    </select>


    <!-- =========================
         TEXT COLOR
    ========================= -->

    <label for="textColor">
      Text Color
    </label>

    <input
      type="color"
      id="textColor"
      value="#ffffff"
    >


    <!-- =========================
         TEXT SIZE
    ========================= -->

    <label for="textSize">
      Text Size
    </label>

    <div class="range-row">

      <input
        type="range"
        id="textSize"
        min="8"
        max="120"
        value="40"
      >

      <span id="sizeValue">
        40 px
      </span>

    </div>


    <!-- =========================
         BACKGROUND
    ========================= -->

    <label for="backgroundColor">
      Pixel Background Color
    </label>

    <input
      type="color"
      id="backgroundColor"
      value="#222222"
    >


    <!-- =========================
         IMAGE CONTROLS
    ========================= -->

    <div id="imageControls">

      <label for="imageSize">
        Image Size
      </label>

      <div class="range-row">

        <input
          type="range"
          id="imageSize"
          min="20"
          max="500"
          value="150"
        >

        <span id="imageSizeValue">
          150 px
        </span>

      </div>

      <div class="help">
        Select an image in the preview, then resize it here.
      </div>

    </div>


    <!-- =========================
         BUTTONS
    ========================= -->

    <div class="button-row">

      <button id="addToPixels">
        ADD TO PIXELS
      </button>

      <button id="addImage">
        ADD IMAGE
      </button>

      <button id="deleteSelected">
        DELETE SELECTED
      </button>

      <button id="backButton">
        GO BACK
      </button>

    </div>


    <input
      type="file"
      id="imageInput"
      accept="image/*"
    >


    <!-- =========================
         OBJECT LIST
    ========================= -->

    <div id="objectList"></div>


    <button id="saveDesign">
      SAVE PIXEL DESIGN
    </button>

  </div>

</div>


<script>

/* =====================================================
   READ SELECTED PIXELS
===================================================== */

const params =
  new URLSearchParams(window.location.search);

const pixelData =
  params.get("pixels");

let selectedPixels = [];


if (pixelData) {

  try {

    selectedPixels =
      JSON.parse(
        decodeURIComponent(pixelData)
      );

  } catch (error) {

    try {

      selectedPixels =
        JSON.parse(pixelData);

    } catch (secondError) {

      console.error(
        "Could not read selected pixels:",
        secondError
      );

    }

  }

}


document.getElementById("pixelCount")
  .textContent =
  selectedPixels.length;


/* =====================================================
   ELEMENTS
===================================================== */

const workspace =
  document.getElementById("workspace");

const designLayer =
  document.getElementById("designLayer");

const textInput =
  document.getElementById("textInput");

const fontFamily =
  document.getElementById("fontFamily");

const textColor =
  document.getElementById("textColor");

const textSize =
  document.getElementById("textSize");

const sizeValue =
  document.getElementById("sizeValue");

const backgroundColor =
  document.getElementById("backgroundColor");

const addToPixels =
  document.getElementById("addToPixels");

const addImage =
  document.getElementById("addImage");

const imageInput =
  document.getElementById("imageInput");

const deleteSelected =
  document.getElementById("deleteSelected");

const saveDesign =
  document.getElementById("saveDesign");

const backButton =
  document.getElementById("backButton");

const objectList =
  document.getElementById("objectList");

const imageControls =
  document.getElementById("imageControls");

const imageSize =
  document.getElementById("imageSize");

const imageSizeValue =
  document.getElementById("imageSizeValue");


/* =====================================================
   SETTINGS
===================================================== */

const PIXEL_SIZE = 40;

let designObjects = [];

let nextObjectId = 1;

let selectedObjectId = null;

let liveTextObject = null;

let editingObjectId = null;

let draggingObject = null;

let dragOffsetX = 0;

let dragOffsetY = 0;


/* =====================================================
   GET PIXEL BOUNDS
===================================================== */

function getPixelBounds() {

  if (!selectedPixels.length) {

    return {
      minX: 0,
      maxX: 0,
      minY: 0,
      maxY: 0
    };

  }


  const coords =
    selectedPixels.map(key => {

      const parts =
        key.split(",");

      return {

        x: Number(parts[0]),

        y: Number(parts[1])

      };

    });


  return {

    minX:
      Math.min(
        ...coords.map(p => p.x)
      ),

    maxX:
      Math.max(
        ...coords.map(p => p.x)
      ),

    minY:
      Math.min(
        ...coords.map(p => p.y)
      ),

    maxY:
      Math.max(
        ...coords.map(p => p.y)
      )

  };

}


/* =====================================================
   BUILD PIXEL MASK
===================================================== */

function buildPixelMask(bounds, columns, rows) {

  if (!selectedPixels.length) {

    return "none";

  }


  /*
    SVG mask:

    White = visible
    Black = hidden

    Every selected pixel gets its own
    white rectangle.
  */

  let svgRects = "";


  selectedPixels.forEach(key => {

    const parts =
      key.split(",");

    const x =
      Number(parts[0]);

    const y =
      Number(parts[1]);


    const maskX =
      (x - bounds.minX) *
      PIXEL_SIZE;

    const maskY =
      (y - bounds.minY) *
      PIXEL_SIZE;


    svgRects +=
      `<rect x="${maskX}" y="${maskY}" width="${PIXEL_SIZE}" height="${PIXEL_SIZE}" fill="white"/>`;

  });


  const svg = `
    <svg xmlns="http://www.w3.org/2000/svg"
         width="${columns * PIXEL_SIZE}"
         height="${rows * PIXEL_SIZE}"
         viewBox="0 0 ${columns * PIXEL_SIZE} ${rows * PIXEL_SIZE}">
      <rect width="100%" height="100%" fill="black"/>
      ${svgRects}
    </svg>
  `;


  const encoded =
    encodeURIComponent(svg)
      .replace(/'/g, "%27")
      .replace(/"/g, "%22");


  return `url("data:image/svg+xml,${encoded}")`;

}


/* =====================================================
   DRAW PIXELS
===================================================== */

function drawPixels() {

  workspace
    .querySelectorAll(".pixel")
    .forEach(el => el.remove());


  const bounds =
    getPixelBounds();


  const columns =
    bounds.maxX -
    bounds.minX +
    1;


  const rows =
    bounds.maxY -
    bounds.minY +
    1;


  const width =
    columns *
    PIXEL_SIZE;


  const height =
    rows *
    PIXEL_SIZE;


  workspace.style.width =
    width + "px";


  workspace.style.height =
    height + "px";


  /*
    Make design layer exactly the same
    size as the pixel workspace.
  */

  designLayer.style.width =
    width + "px";

  designLayer.style.height =
    height + "px";


  /*
    Apply the selected-pixel mask.
  */

  const mask =
    buildPixelMask(
      bounds,
      columns,
      rows
    );


  designLayer.style.webkitMaskImage =
    mask;

  designLayer.style.maskImage =
    mask;


  /*
    Draw ONLY selected pixels.
  */

  selectedPixels.forEach(key => {

    const parts =
      key.split(",");

    const x =
      Number(parts[0]);

    const y =
      Number(parts[1]);


    const pixel =
      document.createElement("div");


    pixel.className =
      "pixel";


    pixel.style.width =
      PIXEL_SIZE + "px";


    pixel.style.height =
      PIXEL_SIZE + "px";


    pixel.style.left =
      (
        (x - bounds.minX) *
        PIXEL_SIZE
      ) + "px";


    pixel.style.top =
      (
        (y - bounds.minY) *
        PIXEL_SIZE
      ) + "px";


    pixel.style.background =
      backgroundColor.value;


    workspace.insertBefore(
      pixel,
      designLayer
    );

  });


  renderObjects();

}


/* =====================================================
   CREATE LIVE TEXT
===================================================== */

function createLiveText() {

  if (liveTextObject) {

    return;

  }


  liveTextObject = {

    id:
      nextObjectId++,

    type:
      "text",

    text:
      "",

    fontFamily:
      fontFamily.value,

    color:
      textColor.value,

    size:
      Number(textSize.value),

    x:
      50,

    y:
      50,

    live:
      true

  };


  selectedObjectId =
    liveTextObject.id;


  editingObjectId =
    null;

}


/* =====================================================
   LIVE TEXT INPUT
===================================================== */

textInput.addEventListener(
  "input",
  function() {

    /*
      If editing an existing object,
      update that object.
    */

    if (editingObjectId !== null) {

      const object =
        designObjects.find(
          item =>
            item.id ===
            editingObjectId
        );


      if (object) {

        object.text =
          textInput.value;

        object.fontFamily =
          fontFamily.value;

        object.color =
          textColor.value;

        object.size =
          Number(textSize.value);

        selectedObjectId =
          object.id;

        renderObjects();

      }

      return;

    }


    /*
      Otherwise create a new live
      text object.
    */

    createLiveText();


    liveTextObject.text =
      textInput.value;

    liveTextObject.fontFamily =
      fontFamily.value;

    liveTextObject.color =
      textColor.value;

    liveTextObject.size =
      Number(textSize.value);


    renderObjects();

  }
);


/* =====================================================
   FONT
===================================================== */

fontFamily.addEventListener(
  "change",
  function() {

    if (editingObjectId !== null) {

      const object =
        designObjects.find(
          item =>
            item.id ===
            editingObjectId
        );


      if (object) {

        object.fontFamily =
          fontFamily.value;

        renderObjects();

      }

      return;

    }


    if (!liveTextObject) {

      return;

    }


    liveTextObject.fontFamily =
      fontFamily.value;


    renderObjects();

  }
);


/* =====================================================
   TEXT COLOR
===================================================== */

textColor.addEventListener(
  "input",
  function() {

    if (editingObjectId !== null) {

      const object =
        designObjects.find(
          item =>
            item.id ===
            editingObjectId
        );


      if (object) {

        object.color =
          textColor.value;

        renderObjects();

      }

      return;

    }


    if (!liveTextObject) {

      return;

    }


    liveTextObject.color =
      textColor.value;


    renderObjects();

  }
);


/* =====================================================
   TEXT SIZE
===================================================== */

textSize.addEventListener(
  "input",
  function() {

    sizeValue.textContent =
      textSize.value +
      " px";


    if (editingObjectId !== null) {

      const object =
        designObjects.find(
          item =>
            item.id ===
            editingObjectId
        );


      if (object) {

        object.size =
          Number(textSize.value);

        renderObjects();

      }

      return;

    }


    if (!liveTextObject) {

      return;

    }


    liveTextObject.size =
      Number(textSize.value);


    renderObjects();

  }
);


/* =====================================================
   BACKGROUND COLOR
===================================================== */

backgroundColor.addEventListener(
  "input",
  function() {

    drawPixels();

  }
);


/* =====================================================
   RENDER OBJECTS
===================================================== */

function renderObjects() {

  designLayer.innerHTML = "";


  const objects = [
    ...designObjects
  ];


  if (
    liveTextObject &&
    liveTextObject.text.length > 0
  ) {

    objects.push(
      liveTextObject
    );

  }


  objects.forEach(
    function(object) {


      /* =========================
         TEXT
      ========================= */

      if (
        object.type === "text"
      ) {

        if (!object.text) {

          return;

        }


        const element =
          document.createElement("div");


        element.className =
          "design-object";


        if (
          object.id ===
          selectedObjectId
        ) {

          element.classList.add(
            "active"
          );

        }


        element.textContent =
          object.text;


        element.style.left =
          object.x + "%";


        element.style.top =
          object.y + "%";


        element.style.fontFamily =
          object.fontFamily;


        element.style.color =
          object.color;


        element.style.fontSize =
          object.size + "px";


        element.dataset.id =
          object.id;


        addDragEvents(
          element,
          object
        );


        designLayer.appendChild(
          element
        );

      }


      /* =========================
         IMAGE
      ========================= */

      if (
        object.type === "image"
      ) {

        const element =
          document.createElement("img");


        element.className =
          "design-object design-image";


        element.src =
          object.src;


        element.style.left =
          object.x + "%";


        element.style.top =
          object.y + "%";


        element.style.width =
          object.width + "px";


        element.style.height =
          "auto";


        element.dataset.id =
          object.id;


        if (
          object.id ===
          selectedObjectId
        ) {

          element.classList.add(
            "active"
          );

        }


        addDragEvents(
          element,
          object
        );


        designLayer.appendChild(
          element
        );

      }

    }
  );


  updateObjectList();

  updateImageControls();

}


/* =====================================================
   DRAGGING
===================================================== */

function addDragEvents(
  element,
  object
) {

  element.addEventListener(
    "pointerdown",
    function(event) {

      event.preventDefault();

      event.stopPropagation();


      selectedObjectId =
        object.id;


      /*
        If a finalized text is clicked,
        load it for editing.
      */

      if (
        object.type === "text" &&
        !object.live
      ) {

        editingObjectId =
          object.id;

        liveTextObject =
          null;


        textInput.value =
          object.text;


        fontFamily.value =
          object.fontFamily;


        textColor.value =
          object.color;


        textSize.value =
          object.size;


        sizeValue.textContent =
          object.size + " px";

      }


      const rect =
        workspace.getBoundingClientRect();


      const objectX =
        object.x /
        100 *
        rect.width;


      const objectY =
        object.y /
        100 *
        rect.height;


      dragOffsetX =
        event.clientX -
        rect.left -
        objectX;


      dragOffsetY =
        event.clientY -
        rect.top -
        objectY;


      draggingObject =
        object;


      /*
        Do NOT completely rebuild the DOM here.
        This keeps dragging smooth.
      */

      element.classList.add(
        "active"
      );

    }
  );

}


/* =====================================================
   DRAG MOVE
===================================================== */

document.addEventListener(
  "pointermove",
  function(event) {

    if (!draggingObject) {

      return;

    }


    const rect =
      workspace.getBoundingClientRect();


    let x =
      event.clientX -
      rect.left -
      dragOffsetX;


    let y =
      event.clientY -
      rect.top -
      dragOffsetY;


    x =
      Math.max(
        0,
        Math.min(
          rect.width,
          x
        )
      );


    y =
      Math.max(
        0,
        Math.min(
          rect.height,
          y
        )
      );


    draggingObject.x =
      (x / rect.width) *
      100;


    draggingObject.y =
      (y / rect.height) *
      100;


    const element =
      designLayer.querySelector(
        `[data-id="${draggingObject.id}"]`
      );


    if (element) {

      element.style.left =
        draggingObject.x +
        "%";


      element.style.top =
        draggingObject.y +
        "%";

    }

  }
);


/* =====================================================
   DRAG END
===================================================== */

document.addEventListener(
  "pointerup",
  function() {

    draggingObject =
      null;

  }
);


/* =====================================================
   ADD TO PIXELS
===================================================== */

addToPixels.addEventListener(
  "click",
  function() {


    /*
      If editing an existing object,
      simply finish the edit.

      DO NOT create a duplicate.
    */

    if (
      editingObjectId !== null
    ) {

      const object =
        designObjects.find(
          item =>
            item.id ===
            editingObjectId
        );


      if (object) {

        object.text =
          textInput.value.trim();

        object.fontFamily =
          fontFamily.value;

        object.color =
          textColor.value;

        object.size =
          Number(textSize.value);

      }


      editingObjectId =
        null;

      selectedObjectId =
        null;

      textInput.value =
        "";

      liveTextObject =
        null;


      renderObjects();

      textInput.focus();

      return;

    }


    /*
      Finalize new live text.
    */

    if (
      !liveTextObject ||
      !liveTextObject.text.trim()
    ) {

      alert(
        "Type something first."
      );

      textInput.focus();

      return;

    }


    liveTextObject.text =
      liveTextObject.text.trim();


    liveTextObject.live =
      false;


    designObjects.push(
      liveTextObject
    );


    /*
      Clear the live draft so the
      customer can immediately type
      another message.
    */

    liveTextObject =
      null;


    selectedObjectId =
      null;


    textInput.value =
      "";


    renderObjects();


    textInput.focus();

  }
);


/* =====================================================
   ADD IMAGE
===================================================== */

addImage.addEventListener(
  "click",
  function() {

    imageInput.click();

  }
);


/* =====================================================
   IMAGE FILE
===================================================== */

imageInput.addEventListener(
  "change",
  function(event) {

    const file =
      event.target.files[0];


    if (!file) {

      return;

    }


    const reader =
      new FileReader();


    reader.onload =
      function(e) {

        const imageObject = {

          id:
            nextObjectId++,

          type:
            "image",

          src:
            e.target.result,

          x:
            50,

          y:
            50,

          width:
            150

        };


        designObjects.push(
          imageObject
        );


        selectedObjectId =
          imageObject.id;


        editingObjectId =
          null;


        imageSize.value =
          imageObject.width;


        imageSizeValue.textContent =
          imageObject.width +
          " px";


        renderObjects();

      };


    reader.readAsDataURL(file);


    /*
      Allows the same image to be
      selected again later.
    */

    event.target.value =
      "";

  }
);


/* =====================================================
   IMAGE SIZE
===================================================== */

imageSize.addEventListener(
  "input",
  function() {

    const object =
      designObjects.find(
        item =>
          item.id ===
          selectedObjectId
      );


    if (
      !object ||
      object.type !== "image"
    ) {

      return;

    }


    object.width =
      Number(imageSize.value);


    imageSizeValue.textContent =
      object.width +
      " px";


    const element =
      designLayer.querySelector(
        `[data-id="${object.id}"]`
      );


    if (element) {

      element.style.width =
        object.width + "px";

    }

  }
);


/* =====================================================
   DELETE SELECTED
===================================================== */

deleteSelected.addEventListener(
  "click",
  function() {

    /*
      Delete live text.
    */

    if (
      liveTextObject &&
      selectedObjectId ===
      liveTextObject.id
    ) {

      liveTextObject =
        null;

      selectedObjectId =
        null;

      textInput.value =
        "";

      renderObjects();

      textInput.focus();

      return;

    }


    /*
      Delete finalized object.
    */

    if (
      selectedObjectId === null
    ) {

      alert(
        "Select a text or image first."
      );

      return;

    }


    designObjects =
      designObjects.filter(
        object =>
          object.id !==
          selectedObjectId
      );


    selectedObjectId =
      null;


    editingObjectId =
      null;


    textInput.value =
      "";


    renderObjects();

    textInput.focus();

  }
);


/* =====================================================
   UPDATE IMAGE CONTROLS
===================================================== */

function updateImageControls() {

  const object =
    designObjects.find(
      item =>
        item.id ===
        selectedObjectId
    );


  if (
    object &&
    object.type === "image"
  ) {

    imageControls.style.display =
      "block";


    imageSize.value =
      object.width;


    imageSizeValue.textContent =
      object.width +
      " px";

  } else {

    imageControls.style.display =
      "none";

  }

}


/* =====================================================
   OBJECT LIST
===================================================== */

function updateObjectList() {

  objectList.innerHTML = "";


  if (!designObjects.length) {

    return;

  }


  const heading =
    document.createElement("div");


  heading.className =
    "object-heading";


  heading.textContent =
    "YOUR DESIGN ELEMENTS";


  objectList.appendChild(
    heading
  );


  designObjects.forEach(
    function(object, index) {

      const item =
        document.createElement("div");


      item.className =
        "object-item";


      if (
        object.id ===
        selectedObjectId
      ) {

        item.classList.add(
          "active"
        );

      }


      if (
        object.type === "text"
      ) {

        item.textContent =
          "Text: " +
          object.text;

      } else {

        item.textContent =
          "Image " +
          (index + 1);

      }


      item.addEventListener(
        "click",
        function() {

          selectedObjectId =
            object.id;


          /*
            Load text for editing.
          */

          if (
            object.type === "text"
          ) {

            editingObjectId =
              object.id;

            liveTextObject =
              null;


            textInput.value =
              object.text;


            fontFamily.value =
              object.fontFamily;


            textColor.value =
              object.color;


            textSize.value =
              object.size;


            sizeValue.textContent =
              object.size +
              " px";

          }


          renderObjects();

        }
      );


      objectList.appendChild(
        item
      );

    }
  );

}


/* =====================================================
   SAVE DESIGN
===================================================== */

saveDesign.addEventListener(
  "click",
  function() {

    /*
      Do not allow an unfinished
      live text draft to be saved.
    */

    if (
      liveTextObject &&
      liveTextObject.text.trim()
    ) {

      alert(
        "Click ADD TO PIXELS first to finish your text."
      );

      textInput.focus();

      return;

    }


    if (!selectedPixels.length) {

      alert(
        "No pixels were selected."
      );

      return;

    }


    const design = {

      selectedPixels:
        selectedPixels,

      backgroundColor:
        backgroundColor.value,

      objects:
        designObjects

    };


    /*
      This is currently only the
      design-stage save.

      Checkout/payment will be
      connected after we finish
      testing this editor.
    */

    console.log(
      "PIXEL DESIGN:",
      design
    );


    alert(
      "Your pixel design is ready for checkout. Checkout will be connected next."
    );

  }
);


/* =====================================================
   GO BACK
===================================================== */

backButton.addEventListener(
  "click",
  function() {

    window.location.href =
      "./index.html";

  }
);


/* =====================================================
   INITIAL DRAW
===================================================== */

sizeValue.textContent =
  textSize.value +
  " px";


drawPixels();


</script>

</body>
</html>
