<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Design Your Pixels - Pixel Takeover</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #111;
  color: white;
}

header {
  text-align: center;
  padding: 25px 15px 10px;
}

h1 {
  margin: 0;
  font-size: 30px;
  letter-spacing: 2px;
}

.subtitle {
  margin-top: 8px;
  color: #aaa;
}

.info {
  text-align: center;
  padding: 15px;
  font-size: 18px;
}

#workspaceWrapper {
  width: 100%;
  overflow: auto;
  padding: 15px;
}

#workspace {
  position: relative;
  margin: auto;
  background: white;
  overflow: hidden;
  border: 3px solid #555;
  min-width: 180px;
  min-height: 180px;
}

.selectedPixel {
  position: absolute;
  border: 1px solid rgba(0,0,0,.15);
  background: #f5f5f5;
}

.designObject {
  position: absolute;
  transform: translate(-50%, -50%);
  cursor: move;
  user-select: none;
  touch-action: none;
  white-space: nowrap;
}

.designObject.selectedObject {
  outline: 2px dashed #111;
  outline-offset: 4px;
}

.controls {
  padding: 20px;
  max-width: 600px;
  margin: auto;
}

.controlGroup {
  margin-bottom: 18px;
}

label {
  display: block;
  margin-bottom: 7px;
  font-weight: bold;
}

input,
select,
textarea {
  width: 100%;
  padding: 12px;
  border-radius: 7px;
  border: 1px solid #555;
  background: #222;
  color: white;
  font-size: 16px;
}

textarea {
  min-height: 80px;
  resize: vertical;
}

button {
  border: none;
  border-radius: 8px;
  padding: 13px 18px;
  margin: 5px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}

#addTextButton {
  background: white;
  color: #111;
}

#addImageButton {
  background: #444;
  color: white;
}

#deleteButton {
  background: #822;
  color: white;
}

#backButton {
  background: #444;
  color: white;
}

#saveButton {
  background: white;
  color: #111;
  width: calc(100% - 10px);
  margin-top: 15px;
}

#objectList {
  margin-top: 15px;
}

.objectItem {
  background: #222;
  border: 1px solid #444;
  border-radius: 7px;
  padding: 10px;
  margin-bottom: 7px;
  cursor: pointer;
}

.objectItem.active {
  border-color: white;
}

.hint {
  color: #aaa;
  font-size: 13px;
  line-height: 1.5;
}

#imageFile {
  display: none;
}

</style>

</head>

<body>

<header>

<h1>DESIGN YOUR PIXELS</h1>

<div class="subtitle">
Make your space yours.
</div>

</header>


<div class="info">

You selected
<strong id="pixelCount">0</strong>
pixels.

</div>


<div id="workspaceWrapper">

<div id="workspace"></div>

</div>


<div class="controls">

<div class="controlGroup">

<label for="designTitle">
Design Name
</label>

<input
id="designTitle"
type="text"
placeholder="Give your design a name"
/>

</div>


<div class="controlGroup">

<label for="textInput">
Text
</label>

<textarea
id="textInput"
placeholder="Type the text you want to add"
></textarea>

</div>


<div class="controlGroup">

<label for="fontFamily">
Font
</label>

<select id="fontFamily">

<option value="Arial">
Arial
</option>

<option value="Georgia">
Georgia
</option>

<option value="Impact">
Impact - Bold
</option>

<option value="Trebuchet MS">
Trebuchet MS
</option>

<option value="Courier New">
Courier New
</option>

<option value="Verdana">
Verdana
</option>

<option value="Comic Sans MS">
Comic Sans
</option>

<option value="cursive">
Cursive
</option>

<option value="fantasy">
Fantasy
</option>

<option value="monospace">
Monospace
</option>

<option value="serif">
Classic Serif
</option>

<option value="sans-serif">
Modern Sans
</option>

</select>

</div>


<div class="controlGroup">

<label for="textColor">
Text Color
</label>

<input
id="textColor"
type="color"
value="#111111"
/>

</div>


<div class="controlGroup">

<label for="textSize">
Text Size
</label>

<input
id="textSize"
type="range"
min="10"
max="100"
value="30"
/>

</div>


<button
id="addTextButton"
type="button"
>
Add Text
</button>


<button
id="addImageButton"
type="button"
>
Add Image / Logo
</button>

<input
id="imageFile"
type="file"
accept="image/*"
/>


<div id="objectList"></div>


<button
id="deleteButton"
type="button"
>
Delete Selected
</button>


<div class="hint">

After adding text or an image, tap it and drag it around your design area.

Each text item can be moved independently.

</div>


<button
id="saveButton"
type="button"
>
Save Design
</button>


<button
id="backButton"
type="button"
>
Back to Pixel Selection
</button>

</div>


<script>

/* =========================================
   READ SELECTED PIXELS FROM THE URL
========================================= */

const params =
  new URLSearchParams(
    window.location.search
  );

const pixelData =
  params.get("pixels");

let selectedPixels = [];


if (pixelData) {

  try {

    selectedPixels =
      JSON.parse(
        decodeURIComponent(pixelData)
      );

  } catch (error) {

    try {

      selectedPixels =
        JSON.parse(pixelData);

    } catch (secondError) {

      console.error(
        "Could not read selected pixels:",
        secondError
      );

    }

  }

}


/* =========================================
   ELEMENTS
========================================= */

const pixelCount =
  document.getElementById(
    "pixelCount"
  );

const workspace =
  document.getElementById(
    "workspace"
  );

const designTitle =
  document.getElementById(
    "designTitle"
  );

const textInput =
  document.getElementById(
    "textInput"
  );

const fontFamily =
  document.getElementById(
    "fontFamily"
  );

const textColor =
  document.getElementById(
    "textColor"
  );

const textSize =
  document.getElementById(
    "textSize"
  );

const addTextButton =
  document.getElementById(
    "addTextButton"
  );

const addImageButton =
  document.getElementById(
    "addImageButton"
  );

const imageFile =
  document.getElementById(
    "imageFile"
  );

const deleteButton =
  document.getElementById(
    "deleteButton"
  );

const saveButton =
  document.getElementById(
    "saveButton"
  );

const backButton =
  document.getElementById(
    "backButton"
  );

const objectList =
  document.getElementById(
    "objectList"
  );


pixelCount.textContent =
  selectedPixels.length;


/* =========================================
   DETERMINE SELECTED AREA
========================================= */

function getCoordinates() {

  if (
    selectedPixels.length === 0
  ) {

    return {
      minX: 0,
      maxX: 9,
      minY: 0,
      maxY: 9
    };

  }


  const coordinates =
    selectedPixels.map(
      function(pixel) {

        const parts =
          pixel.split(",");

        return {
          x: Number(parts[0]),
          y: Number(parts[1])
        };

      }
    );


  return {

    minX: Math.min(
      ...coordinates.map(
        p => p.x
      )
    ),

    maxX: Math.max(
      ...coordinates.map(
        p => p.x
      )
    ),

    minY: Math.min(
      ...coordinates.map(
        p => p.y
      )
    ),

    maxY: Math.max(
      ...coordinates.map(
        p => p.y
      )
    )

  };

}


const bounds =
  getCoordinates();


const columns =
  bounds.maxX -
  bounds.minX +
  1;


const rows =
  bounds.maxY -
  bounds.minY +
  1;


/* =========================================
   WORKSPACE SIZE
========================================= */

const PIXEL_SIZE = 40;


workspace.style.width =
  (columns * PIXEL_SIZE) + "px";

workspace.style.height =
  (rows * PIXEL_SIZE) + "px";


/* =========================================
   DRAW SELECTED PIXELS
========================================= */

selectedPixels.forEach(
  function(pixelKey) {

    const parts =
      pixelKey.split(",");

    const x =
      Number(parts[0]);

    const y =
      Number(parts[1]);


    const pixel =
      document.createElement("div");


    pixel.className =
      "selectedPixel";


    pixel.style.width =
      PIXEL_SIZE + "px";

    pixel.style.height =
      PIXEL_SIZE + "px";


    pixel.style.left =
      (
        (x - bounds.minX)
        * PIXEL_SIZE
      ) + "px";


    pixel.style.top =
      (
        (y - bounds.minY)
        * PIXEL_SIZE
      ) + "px";


    workspace.appendChild(
      pixel
    );

  }
);


/* =========================================
   DESIGN OBJECTS
========================================= */

let designObjects = [];

let selectedObjectId = null;

let nextObjectId = 1;


/* =========================================
   RENDER OBJECTS
========================================= */

function renderObjects() {

  document
    .querySelectorAll(".designObject")
    .forEach(
      element =>
        element.remove()
    );


  designObjects.forEach(
    function(object) {

      const element =
        document.createElement("div");


      element.className =
        "designObject";


      if (
        object.id ===
        selectedObjectId
      ) {

        element.classList.add(
          "selectedObject"
        );

      }


      element.style.left =
        object.x + "%";

      element.style.top =
        object.y + "%";


      if (
        object.type === "text"
      ) {

        element.textContent =
          object.text;

        element.style.fontFamily =
          object.fontFamily;

        element.style.color =
          object.color;

        element.style.fontSize =
          object.size + "px";

        element.style.fontWeight =
          object.fontWeight ||
          "normal";

      }


      if (
        object.type === "image"
      ) {

        const image =
          document.createElement("img");

        image.src =
          object.src;

        image.style.width =
          object.width + "px";

        image.style.maxWidth =
          "80%";

        image.style.maxHeight =
          "80%";

        element.appendChild(
          image
        );

      }


      element.addEventListener(
        "pointerdown",
        function(event) {

          event.preventDefault();

          selectedObjectId =
            object.id;

          renderObjects();

          startDrag(
            event,
            object
          );

        }
      );


      workspace.appendChild(
        element
      );

    }
  );


  renderObjectList();

}


/* =========================================
   OBJECT LIST
========================================= */

function renderObjectList() {

  objectList.innerHTML = "";


  designObjects.forEach(
    function(object) {

      const item =
        document.createElement("div");


      item.className =
        "objectItem";


      if (
        object.id ===
        selectedObjectId
      ) {

        item.classList.add(
          "active"
        );

      }


      if (
        object.type === "text"
      ) {

        item.textContent =
          "Text: " +
          object.text;

      } else {

        item.textContent =
          "Image / Logo";

      }


      item.addEventListener(
        "click",
        function() {

          selectedObjectId =
            object.id;

          renderObjects();

        }
      );


      objectList.appendChild(
        item
      );

    }
  );

}


/* =========================================
   ADD TEXT
========================================= */

addTextButton.addEventListener(
  "click",
  function() {

    const text =
      textInput.value.trim();


    if (!text) {

      alert(
        "Type some text first."
      );

      return;

    }


    const object = {

      id: nextObjectId++,

      type: "text",

      text: text,

      fontFamily:
        fontFamily.value,

      color:
        textColor.value,

      size:
        Number(
          textSize.value
        ),

      x: 50,

      y: 50

    };


    designObjects.push(
      object
    );


    selectedObjectId =
      object.id;


    renderObjects();

  }
);


/* =========================================
   ADD IMAGE
========================================= */

addImageButton.addEventListener(
  "click",
  function() {

    imageFile.click();

  }
);


imageFile.addEventListener(
  "change",
  function() {

    const file =
      imageFile.files[0];


    if (!file) {
      return;
    }


    const reader =
      new FileReader();


    reader.onload =
      function(event) {

        const object = {

          id: nextObjectId++,

          type: "image",

          src:
            event.target.result,

          width: 120,

          x: 50,

          y: 50

        };


        designObjects.push(
          object
        );


        selectedObjectId =
          object.id;


        renderObjects();

      };


    reader.readAsDataURL(
      file
    );

  }
);


/* =========================================
   DRAG OBJECT
========================================= */

let draggingObject = null;

let dragStartX = 0;

let dragStartY = 0;

let originalX = 0;

let originalY = 0;


function startDrag(
  event,
  object
) {

  draggingObject =
    object;


  dragStartX =
    event.clientX;

  dragStartY =
    event.clientY;


  originalX =
    object.x;

  originalY =
    object.y;


  document.addEventListener(
    "pointermove",
    dragMove
  );

  document.addEventListener(
    "pointerup",
    endDrag,
    { once: true }
  );

}


function dragMove(event) {

  if (!draggingObject) {
    return;
  }


  const rect =
    workspace.getBoundingClientRect();


  const changeX =
    (
      event.clientX -
      dragStartX
    ) /
    rect.width *
    100;


  const changeY =
    (
      event.clientY -
      dragStartY
    ) /
    rect.height *
    100;


  draggingObject.x =
    Math.max(
      0,
      Math.min(
        100,
        originalX + changeX
      )
    );


  draggingObject.y =
    Math.max(
      0,
      Math.min(
        100,
        originalY + changeY
      )
    );


  renderObjects();

}


function endDrag() {

  draggingObject =
    null;


  document.removeEventListener(
    "pointermove",
    dragMove
  );

}


/* =========================================
   DELETE
========================================= */

deleteButton.addEventListener(
  "click",
  function() {

    if (
      selectedObjectId === null
    ) {

      return;

    }


    designObjects =
      designObjects.filter(
        function(object) {

          return (
            object.id !==
            selectedObjectId
          );

        }
      );


    selectedObjectId =
      null;


    renderObjects();

  }
);


/* =========================================
   SAVE
========================================= */

saveButton.addEventListener(
  "click",
  function() {

    if (
      selectedPixels.length === 0
    ) {

      alert(
        "No pixels were selected."
      );

      return;

    }


    if (
      designObjects.length === 0
    ) {

      alert(
        "Add some text or an image to your design first."
      );

      return;

    }


    const design = {

      title:
        designTitle.value,

      selectedPixels:
        selectedPixels,

      objects:
        designObjects

    };


    console.log(
      "PIXEL TAKEOVER DESIGN:",
      design
    );


    alert(
      "Your design has been created! The permanent save and payment step will be connected next."
    );

  }
);


/* =========================================
   BACK
========================================= */

backButton.addEventListener(
  "click",
  function() {

    window.location.href =
      "./index.html";

  }
);


/* =========================================
   INITIAL RENDER
========================================= */

renderObjects();

</script>

</body>
</html>
