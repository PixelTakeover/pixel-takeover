<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Pixel Takeover</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  background: #111;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

h1 {
  margin-bottom: 5px;
}

.subtitle {
  color: #aaa;
  margin-bottom: 20px;
}

#pixelCanvas {
  display: grid;
  grid-template-columns: repeat(30, 1fr);
  width: min(95vw, 750px);
  margin: 20px auto;
  gap: 1px;
  background: #333;
  padding: 3px;
}

.pixel {
  aspect-ratio: 1 / 1;
  background: #eee;
  cursor: pointer;
}

.pixel:hover {
  opacity: 0.75;
}

.pixel.selected {
  background: #00ff99;
}

.pixel.claimed {
  background: #555;
  cursor: not-allowed;
}

.info {
  margin: 15px;
  font-size: 18px;
}

.price {
  font-size: 24px;
  font-weight: bold;
}

button {
  padding: 15px 25px;
  border: none;
  border-radius: 10px;
  background: #00ff99;
  color: #111;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

</style>

</head>

<body>

<h1>PIXEL TAKEOVER</h1>

<div class="subtitle">
  Choose your pixels. Make them yours.
</div>

<div class="info">
  Selected Pixels:
  <strong id="selectedCount">0</strong>
</div>

<div class="price">
  $<span id="totalPrice">0</span>
</div>

<div id="pixelCanvas"></div>

<button id="claimButton" disabled>
  Continue With Selected Pixels
</button>


<script>

/* ---------------------------------
   SETTINGS
---------------------------------- */

const GRID_WIDTH = 30;
const GRID_HEIGHT = 20;


/* ---------------------------------
   ELEMENTS
---------------------------------- */

const canvas =
  document.getElementById("pixelCanvas");

const selectedCount =
  document.getElementById("selectedCount");

const totalPrice =
  document.getElementById("totalPrice");

const claimButton =
  document.getElementById("claimButton");


/* ---------------------------------
   PIXEL DATA
---------------------------------- */

const selectedPixels =
  new Set();

const claimedPixels =
  new Set();


function pixelKey(x, y) {

  return `${x},${y}`;

}


/* ---------------------------------
   CREATE CANVAS
---------------------------------- */

function createCanvas() {

  canvas.innerHTML = "";

  for (
    let y = 0;
    y < GRID_HEIGHT;
    y++
  ) {

    for (
      let x = 0;
      x < GRID_WIDTH;
      x++
    ) {

      const pixel =
        document.createElement("div");

      pixel.className =
        "pixel";

      pixel.dataset.x = x;
      pixel.dataset.y = y;

      const key =
        pixelKey(x, y);


      if (
        claimedPixels.has(key)
      ) {

        pixel.classList.add(
          "claimed"
        );

      }


      pixel.addEventListener(
        "click",
        function() {

          if (
            claimedPixels.has(key)
          ) {

            return;

          }


          if (
            selectedPixels.has(key)
          ) {

            selectedPixels.delete(key);

            pixel.classList.remove(
              "selected"
            );

          } else {

            selectedPixels.add(key);

            pixel.classList.add(
              "selected"
            );

          }


          updateSelection();

        }
      );


      canvas.appendChild(pixel);

    }

  }

}


/* ---------------------------------
   UPDATE SELECTION
---------------------------------- */

function updateSelection() {

  const count =
    selectedPixels.size;

  selectedCount.textContent =
    count;

  totalPrice.textContent =
    count;

  claimButton.disabled =
    count === 0;

}


/* ---------------------------------
   SEND PIXELS TO DESIGN PAGE
---------------------------------- */

claimButton.addEventListener(
  "click",
  function() {

    if (selectedPixels.size === 0) {
      return;
    }

    const pixels =
      Array.from(selectedPixels);

    sessionStorage.setItem(
      "pixelTakeoverSelection",
      JSON.stringify(pixels)
    );

    window.location.href =
      "design.html";

  }
);
/* ---------------------------------
   START
---------------------------------- */

createCanvas();

updateSelection();

</script>

</body>

</html>
