<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel Takeover - Checkout</title>
<script src="https://www.paypal.com/sdk/js?client-id=AWC__Xd9H1_gIXvNqGD73laBH-tXrRPFBWoI3hEL_-obkc8uYbEJeoCdrzwjaztNlj1mpo3-Rxb1IJIy&currency=USD"></script>
<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #080808;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  padding: 25px 20px;
  text-align: center;
  border-bottom: 1px solid #333;
}

header h1 {
  margin: 0;
  font-size: 30px;
  letter-spacing: 2px;
}

header p {
  margin: 8px 0 0;
  color: #aaa;
}

.container {
  width: min(1100px, 94%);
  margin: 30px auto;
}

.checkout-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 25px;
}

.card {
  background: #111;
  border: 1px solid #333;
  border-radius: 14px;
  padding: 22px;
}

.card h2 {
  margin-top: 0;
}

.design-title {
  color: #aaa;
  margin: -8px 0 18px;
  font-size: 14px;
}

/* ==========================================
   DESIGN PREVIEW
========================================== */

#preview {
  position: relative;
  width: 100%;
  aspect-ratio: 1 / 1;
  background: #050507;
  overflow: hidden;
  border-radius: 10px;
}

/*
   This layer represents the ORIGINAL
   pixel coordinate system.

   The selected pixels are placed into
   this layer using their real x/y values.
*/
#pixelCanvas {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
}

/* Selected pixel cells */

.preview-pixel {
  position: absolute;
  border: 1px solid rgba(0,0,0,.12);
}

/* Design objects */

#designObjects {
  position: absolute;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

.preview-object {
  position: absolute;
  transform-origin: center center;
  overflow: visible;
  pointer-events: none;
}

.preview-text {
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  white-space: pre-wrap;
  word-break: break-word;
  overflow: hidden;
  line-height: 1.1;
}

.preview-image {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
}

/* ==========================================
   ORDER INFORMATION
========================================== */

.info-row {
  display: flex;
  justify-content: space-between;
  padding: 13px 0;
  border-bottom: 1px solid #292929;
}

.info-row:last-child {
  border-bottom: none;
}

.label {
  color: #aaa;
}

.value {
  font-weight: bold;
}

.total {
  font-size: 26px;
  margin-top: 20px;
}

#paypal-button-container {
  margin-top: 25px;
}

/* ==========================================
   MESSAGES
========================================== */

.message {
  margin-top: 20px;
  padding: 14px;
  border-radius: 8px;
  display: none;
}

.error {
  background: #351414;
  color: #ffb0b0;
}

.success {
  background: #14351b;
  color: #b5ffbf;
}

/* ==========================================
   BACK BUTTON
========================================== */

.back {
  display: inline-block;
  margin-top: 25px;
  color: white;
  text-decoration: none;
  border: 1px solid #555;
  padding: 10px 16px;
  border-radius: 8px;
}

.back:hover {
  background: #222;
}

/* ==========================================
   MOBILE
========================================== */

@media (max-width: 800px) {

  .checkout-grid {
    grid-template-columns: 1fr;
  }

  header h1 {
    font-size: 25px;
  }
}
</style>
</head>
<body>
<header>
  <h1>PIXEL TAKEOVER</h1>
  <p>Complete Your Pixel Claim</p>
</header>
<div class="container">
  <div class="checkout-grid">
<!-- DESIGN PREVIEW -->

<div class="card">

  <h2>Your Design</h2>

  <div id="designTitle" class="design-title"></div>

  <div id="preview">

    <!-- Exact pixel shape goes here -->
    <div id="pixelCanvas"></div>

    <!-- Text/image objects go here -->
    <div id="designObjects"></div>

  </div>

  <a href="./design.html" class="back">
    ← Back to Design
  </a>

</div>


<!-- ORDER SUMMARY -->

<div class="card">

  <h2>Order Summary</h2>

  <div class="info-row">
    <span class="label">Pixels</span>
    <span class="value" id="pixelCount">0</span>
  </div>

  <div class="info-row">
    <span class="label">Price per pixel</span>
    <span class="value">$1.00</span>
  </div>

  <div class="info-row total">
    <span>Total</span>
    <span id="total">$0.00</span>
  </div>

  <div id="paypal-button-container"></div>

  <div id="errorMessage" class="message error"></div>

  <div id="successMessage" class="message success">
    Payment completed successfully!
    <br><br>
    Your pixels have been purchased.
  </div>

</div>
  </div>
</div>
<script>

/* ==========================================
   SUPABASE
========================================== */

const SUPABASE_URL =
  "https://bbnvqmeyivteehsdlptw.supabase.co";

const SUPABASE_ANON_KEY =
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJIUzI1NiIsInJlZiI6ImJibnZxbWV5aXZ0ZWVobGRwdHciLCJyb2xlIjoiYW5vbiIsImlhdCI6MTc4OTM5Nzk2OCwiZXhwIjoyMTA0OTczOTY4fQ.0K0wWo4jJtMfsqGOhPBi-jbMKJZvIrq01ZcMf3QvXV4";

let checkoutData = null;


/* ==========================================
   LOAD SAVED DESIGN
========================================== */

function loadCheckoutData() {

  const saved =
    localStorage.getItem(
      "pixelTakeoverDesign"
    );

  if (!saved) {

    showError(
      "Your design information could not be found. Please return to the design page."
    );

    return false;
  }

  try {

    checkoutData =
      JSON.parse(saved);

  } catch (error) {

    console.error(
      "Design data error:",
      error
    );

    showError(
      "Your design information could not be read."
    );

    return false;
  }

  return true;
}


/* ==========================================
   PIXEL COUNT
========================================== */

function getPixelCount() {

  if (
    checkoutData &&
    Array.isArray(
      checkoutData.selectedPixels
    )
  ) {

    return checkoutData.selectedPixels.length;
  }

  return 0;
}


/* ==========================================
   ORDER DISPLAY
========================================== */

function displayOrder() {

  const count =
    getPixelCount();

  document.getElementById(
    "pixelCount"
  ).textContent =
    count;

  document.getElementById(
    "total"
  ).textContent =
    "$" +
    count.toFixed(2);


  const titleBox =
    document.getElementById(
      "designTitle"
    );

  if (
    checkoutData &&
    checkoutData.title
  ) {

    titleBox.textContent =
      "Design: " +
      checkoutData.title;

  } else {

    titleBox.textContent =
      "Your Pixel Design";
  }
}


/* ==========================================
   COORDINATES
========================================== */

function getPixelCoordinate(pixel) {

  if (
    typeof pixel === "string"
  ) {

    const parts =
      pixel.split(",");

    return {
      x: Number(parts[0]),
      y: Number(parts[1])
    };
  }

  return {
    x: Number(pixel.x),
    y: Number(pixel.y)
  };
}


/* ==========================================
   RENDER EXACT PIXEL SHAPE
========================================== */

function renderPixelShape() {

  const preview =
    document.getElementById(
      "preview"
    );

  const canvas =
    document.getElementById(
      "pixelCanvas"
    );


  canvas.innerHTML = "";


  const pixels =
    Array.isArray(
      checkoutData.selectedPixels
    )
      ? checkoutData.selectedPixels
      : [];


  if (!pixels.length) {
    return;
  }


  const coordinates =
    pixels
      .map(getPixelCoordinate)
      .filter(
        pixel =>
          Number.isFinite(pixel.x) &&
          Number.isFinite(pixel.y)
      );


  if (!coordinates.length) {
    return;
  }


  /*
   * Find the TRUE boundaries of the
   * selected pixels.
   */

  const minX =
    Math.min(
      ...coordinates.map(
        p => p.x
      )
    );

  const maxX =
    Math.max(
      ...coordinates.map(
        p => p.x
      )
    );

  const minY =
    Math.min(
      ...coordinates.map(
        p => p.y
      )
    );

  const maxY =
    Math.max(
      ...coordinates.map(
        p => p.y
      )
    );


  const columns =
    maxX - minX + 1;

  const rows =
    maxY - minY + 1;


  /*
   * Fit the ORIGINAL selection inside
   * the checkout preview.

   * The important difference:
   * We are NOT filling missing cells.
   */

  const maxPreviewSize =
    preview.clientWidth * 0.72;

  const cellSize =
    Math.min(
      maxPreviewSize / columns,
      maxPreviewSize / rows
    );


  canvas.style.width =
    columns * cellSize + "px";

  canvas.style.height =
    rows * cellSize + "px";


  /*
   * Only create cells for pixels
   * that actually exist.
   */

  coordinates.forEach(pixel => {

    const square =
      document.createElement(
        "div"
      );

    square.className =
      "preview-pixel";


    square.style.left =
      (
        (pixel.x - minX) *
        cellSize
      ) + "px";


    square.style.top =
      (
        (pixel.y - minY) *
        cellSize
      ) + "px";


    square.style.width =
      cellSize + "px";


    square.style.height =
      cellSize + "px";


    square.style.background =
      checkoutData.backgroundColor ||
      "#ffffff";


    canvas.appendChild(
      square
    );

  });


  /*
   * The pixel shape itself now
   * remains exactly the same.
   */

  console.log(
    "Exact pixel selection:",
    coordinates
  );
}


/* ==========================================
   RENDER DESIGN OBJECTS
========================================== */

function renderDesignObjects() {

  const preview =
    document.getElementById(
      "preview"
    );

  const designObjects =
    document.getElementById(
      "designObjects"
    );


  designObjects.innerHTML = "";


  const objects =
    Array.isArray(
      checkoutData.objects
    )
      ? checkoutData.objects
      : [];


  objects.forEach(object => {

    if (!object) {
      return;
    }


    const wrapper =
      document.createElement(
        "div"
      );


    wrapper.className =
      "preview-object";


    /*
     * These coordinates are the same
     * percentage coordinates used by
     * design.html.
     */

    wrapper.style.left =
      Number(object.x || 0) +
      "%";


    wrapper.style.top =
      Number(object.y || 0) +
      "%";


    wrapper.style.width =
      Number(object.width || 10) +
      "%";


    wrapper.style.height =
      Number(object.height || 10) +
      "%";


    wrapper.style.transform =
      "translate(-50%, -50%) rotate(" +
      Number(object.rotation || 0) +
      "deg)";


    /* TEXT */

    if (
      object.type === "text"
    ) {

      const text =
        document.createElement(
          "div"
        );


      text.className =
        "preview-text";


      text.textContent =
        object.text || "";


      text.style.width =
        "100%";


      text.style.height =
        "100%";


      text.style.color =
        object.color ||
        checkoutData.messageColor ||
        "#000000";


      text.style.fontFamily =
        object.fontFamily ||
        checkoutData.fontFamily ||
        "Arial";


      text.style.fontWeight =
        object.fontWeight ||
        "normal";


      const originalFontSize =
        Number(
          object.fontSize ||
          checkoutData.messageSize ||
          24
        );


      const scale =
        preview.clientWidth /
        700;


      text.style.fontSize =
        Math.max(
          8,
          originalFontSize * scale
        ) +
        "px";


      wrapper.appendChild(
        text
      );
    }


    /* IMAGE */

    else if (
      object.type === "image"
    ) {

      const image =
        document.createElement(
          "img"
        );


      image.className =
        "preview-image";


      image.src =
        object.imageData ||
        object.src ||
        object.image ||
        "";


      if (
        image.src
      ) {

        wrapper.appendChild(
          image
        );
      }
    }


    if (
      wrapper.children.length
    ) {

      designObjects.appendChild(
        wrapper
      );
    }

  });
}


/* ==========================================
   RENDER EVERYTHING
========================================== */

function renderPreview() {

  if (!checkoutData) {
    return;
  }


  const preview =
    document.getElementById(
      "preview"
    );


  /*
   * Keep the checkout background dark.
   * The actual purchased pixels get
   * their saved pixel color.
   */

  preview.style.background =
    "#050507";


  renderPixelShape();

  renderDesignObjects();
}


/* ==========================================
   ERROR
========================================== */

function showError(message) {

  const box =
    document.getElementById(
      "errorMessage"
    );

  box.textContent =
    message;

  box.style.display =
    "block";
}


function hideError() {

  document.getElementById(
    "errorMessage"
  ).style.display =
    "none";
}


/* ==========================================
   PAYPAL CREATE ORDER
========================================== */

async function createPayPalOrder() {

  const pixelCount =
    getPixelCount();


  if (
    !pixelCount ||
    pixelCount < 1
  ) {

    throw new Error(
      "No pixels were selected."
    );
  }


  const response =
    await fetch(
      SUPABASE_URL +
      "/functions/v1/paypal-create-order",
      {
        method: "POST",

       headers: {
  "Content-Type": "application/json",
  "apikey": SUPABASE_ANON_KEY,
  "Authorization": "Bearer " + SUPABASE_ANON_KEY
},

        body:
          JSON.stringify({
            pixelCount:
              pixelCount
          })
      }
    );


  const data =
    await response.json();


  if (!response.ok) {

    throw new Error(
      data.error ||
      "Unable to create PayPal order."
    );
  }


  if (!data.orderID) {

    throw new Error(
      "PayPal did not return an order ID."
    );
  }


  return data.orderID;
}


/* ==========================================
   PAYPAL CAPTURE
========================================== */

async function capturePayPalOrder(
  orderID
) {

  const response =
    await fetch(
      SUPABASE_URL +
      "/functions/v1/paypal-capture-order",
      {
        method: "POST",

        headers: {
  "Content-Type": "application/json",
  "apikey": SUPABASE_ANON_KEY,
  "Authorization": "Bearer " + SUPABASE_ANON_KEY
},

        body:
          JSON.stringify({
            orderID:
              orderID
          })
      }
    );


  const data =
    await response.json();


  if (
    !response.ok ||
    !data.success
  ) {

    throw new Error(
      data.error ||
      "Payment could not be completed."
    );
  }


  return data;
}


/* ==========================================
   PAYPAL BUTTONS
========================================== */

function setupPayPal() {

  paypal.Buttons({

    style: {
      layout: "vertical",
      shape: "rect",
      label: "paypal"
    },


    createOrder:
      async function() {

        try {

          hideError();

          return await createPayPalOrder();

        } catch (error) {

          console.error(
            "Create order error:",
            error
          );

          showError(
            error.message
          );

          throw error;
        }
      },


    onApprove:
      async function(data) {

        try {

          hideError();

          await capturePayPalOrder(
            data.orderID
          );


          document.getElementById(
            "successMessage"
          ).style.display =
            "block";


          document.getElementById(
            "paypal-button-container"
          ).style.display =
            "none";


        } catch (error) {

          console.error(
            "Capture error:",
            error
          );

          showError(
            error.message
          );
        }
      },


    onCancel:
      function() {

        showError(
          "Payment was cancelled. Your pixels have not been purchased."
        );
      },


    onError:
      function(error) {

        console.error(
          "PayPal error:",
          error
        );

        showError(
          "PayPal encountered an error. Please try again."
        );
      }

  }).render(
    "#paypal-button-container"
  );
}


/* ==========================================
   START
========================================== */

if (
  loadCheckoutData()
) {

  displayOrder();

  renderPreview();

  setupPayPal();
}


/* ==========================================
   RESIZE
========================================== */

window.addEventListener(
  "resize",
  function() {

    if (checkoutData) {
      renderPreview();
    }

  }
);

</script>
</body>
</html>
